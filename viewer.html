<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우리 아이 그림책 📖</title>
<style>
  :root { --pink:#F35AA0; --bg:#FDF6F9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  #app { height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .msg { color:#9a7; font-size:18px; padding:24px; text-align:center; }
  #book { position:relative; width:100%; max-width:900px; height:100%; display:flex; align-items:center; justify-content:center; padding:12px; }
  .stage { position:relative; perspective:2000px; margin:0 auto; }
  /* 펼침면(가로 3:2)과 표지 반쪽(세로 3:4)은 화면에 맞추는 기준이 반대다.
     가로는 폭 기준, 세로는 높이 기준으로 잡아야 잘리거나 늘어나지 않는다. */
  .stage.spread { width:min(100%, calc(84vh * 3 / 2)); aspect-ratio:3 / 2; }
  .stage.single { height:min(84vh, calc(92vw * 4 / 3)); aspect-ratio:3 / 4; }
  .page { position:absolute; inset:0; border-radius:14px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.18);
          background:#fff; display:flex; align-items:center; justify-content:center;
          transition:transform .5s ease, opacity .3s ease; transform-origin:left center; backface-visibility:hidden; }
  .page img { width:100%; height:100%; object-fit:contain; display:block; }
  /* 표지 스프레드는 [뒤표지|앞표지]가 한 장에 붙어 있어 반쪽만 보여준다(배경 위치로 크롭). */
  .page .half { width:100%; height:100%; background-size:200% 100%; background-repeat:no-repeat; }
  .page .half.left  { background-position:left center; }
  .page .half.right { background-position:right center; }
  .page.flipping { transform:rotateY(-160deg); opacity:0; }
  .page img, .page .half { transform-origin:center center; will-change:transform; touch-action:none; }
  .page img.zoomed, .page .half.zoomed { cursor:grab; }
  /* 확대·축소 도구 — 누구나 쓸 수 있게(부모님도 자세히 보시라고) */
  /* 크기 조절은 선생님이 그림을 맞춰 저장하는 도구 — 평소(부모님 링크)엔 숨긴다. */
  #zoomBar { position:absolute; bottom:10px; right:10px; z-index:7; display:none; gap:6px; align-items:center; }
  body.admin #zoomBar { display:flex; }
  #zoomBar button { border:0; width:40px; height:40px; border-radius:50%; font-size:18px; font-weight:800;
                    cursor:pointer; background:rgba(255,255,255,.92); color:var(--pink);
                    box-shadow:0 3px 10px rgba(0,0,0,.12); font-family:inherit; }
  #zoomBar #zoomFit, #zoomBar #zoomWide { width:auto; padding:0 12px; font-size:13px; white-space:nowrap; }
  #zoomPct { background:rgba(255,255,255,.92); color:#888; font-size:12px; font-weight:700;
             padding:6px 10px; border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.12); }
  /* 관리자 도구 — 평소엔 자물쇠만, 열면 '그림 바꾸기'가 나온다 */
  #adminBar { position:absolute; top:8px; right:10px; z-index:8; display:flex; gap:8px; align-items:center; }
  #adminBar button { border:0; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700;
                     cursor:pointer; background:rgba(255,255,255,.85); color:#8a6;
                     box-shadow:0 2px 8px rgba(0,0,0,.08); font-family:inherit; }
  #swapBtn { background:var(--pink); color:#fff; }
  #adminBar button[disabled] { opacity:.6; cursor:default; }
  @media (max-width: 520px) {
    #zoomBar { gap:4px; }
    #zoomBar button { width:34px; height:34px; font-size:16px; }
    #zoomBar #zoomFit, #zoomBar #zoomWide { padding:0 8px; font-size:12px; }
    #zoomPct { padding:5px 7px; font-size:11px; }
  }
  #backlist { position:absolute; top:10px; left:12px; z-index:8; background:transparent; border:0; cursor:pointer;
              font-weight:800; font-size:15px; color:#333; padding:6px 4px; font-family:inherit; }
  .nav { position:absolute; top:0; bottom:0; width:36%; border:0; background:transparent; cursor:pointer; z-index:5; }
  .nav.prev { left:0; } .nav.next { right:0; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); font-size:34px; color:var(--pink); opacity:.55;
           background:#fff; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
           box-shadow:0 4px 12px rgba(0,0,0,.12); z-index:6; pointer-events:none; }
  .arrow.l { left:8px; } .arrow.r { right:8px; }
  #counter { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:var(--pink); color:#fff;
             font-weight:700; font-size:14px; padding:5px 14px; border-radius:999px; z-index:7; }
  #title { position:absolute; top:10px; left:50%; transform:translateX(-50%); color:var(--pink); font-weight:800; font-size:16px; z-index:7; }
  #classlist { width:100%; max-width:960px; height:100%; overflow:auto; padding:18px; }
  #classlist h1 { color:var(--pink); font-size:20px; text-align:center; margin:8px 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .bookcard { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.1); cursor:pointer; }
  .bookcard img { width:100%; aspect-ratio:3/2; object-fit:cover; display:block; background:#f2e6ee; }
  .bookcard .cap { padding:8px 10px; }
  .bookcard .t { font-weight:800; font-size:14px; color:#333; }
  .bookcard .s { font-size:12px; color:#999; }
</style>
</head>
<body>
<div id="app">
  <div id="loading" class="msg">그림책을 불러오는 중… 📖</div>
  <div id="error" class="msg" hidden>그림책을 찾지 못했어요 😢<br>주소를 다시 확인해 주세요.</div>
  <div id="empty" class="msg" hidden>📭 이 반엔 아직 온라인에 올린 그림책이 없어요.<br><span id="emptyHint" style="font-size:13px;opacity:.7"></span></div>
  <div id="classlist" hidden><h1>우리 반 그림책 문집 📖</h1><div class="grid" id="grid"></div></div>
  <div id="book" hidden>
    <button id="backlist" hidden>‹ 리스트로 돌아가기</button>
    <div id="title">그림책 📖</div>
    <div class="stage" id="stage"></div>
    <div class="arrow l">‹</div>
    <div class="arrow r">›</div>
    <button class="nav prev" id="prev" aria-label="이전"></button>
    <button class="nav next" id="next" aria-label="다음"></button>
    <div id="counter">1 / 1</div>
    <div id="zoomBar">
      <span id="zoomPct">100%</span>
      <button id="zoomOut" title="작게">－</button>
      <button id="zoomIn" title="크게">＋</button>
      <button id="zoomWide" title="가로에 맞춤">가로 맞춤</button>
      <button id="zoomFit" title="화면에 맞춤">맞춤</button>
    </div>
    <div id="adminBar">
      <button id="lockBtn" title="관리자">🔒</button>
      <button id="swapBtn" hidden>🖼 이 쪽 그림 바꾸기</button>
      <button id="saveViewBtn" hidden>💾 이 모습대로 저장</button>
      <input id="swapFile" type="file" accept="image/*" hidden />
    </div>
  </div>
</div>
<script>
  // ⬇️ gas/ 배포 후 웹앱 /exec URL 로 교체
  var API = "https://script.google.com/macros/s/AKfycbzBg9ghzZSLv0J3MlUWMNVscBQuKVd2JgYS-HyiBAuqzPEh5qbGCUW9o_PorKOILx4/exec";
  var qp = new URLSearchParams(location.search);
  var bookId = qp.get("book");
  var classId = qp.get("class");
  var pages = [], idx = 0, animating = false;

  var el = function(id){ return document.getElementById(id); };
  var stage = el("stage");

  function show(state){
    el("loading").hidden    = state !== "loading";
    el("error").hidden      = state !== "error";
    el("empty").hidden      = state !== "empty";
    el("book").hidden       = state !== "book";
    el("classlist").hidden  = state !== "class";
  }

  /* 앱이 보내는 건 펼침면 4장(표지·1-2쪽·3-4쪽·5-6쪽).
     표지 장은 [뒤표지|앞표지]가 좌우로 붙어 있으므로 이북에서는 반으로 갈라
     앞표지(오른쪽 반)를 맨 앞, 뒤표지(왼쪽 반)를 맨 뒤로 보낸다. → 앞표지·1-2·3-4·5-6·뒤표지 */
  function buildPages(srcs){
    if (srcs.length < 2) return srcs.map(function(u, i){ return { src:u, half:null, file:i }; });
    var out = [{ src:srcs[0], half:"right", file:0 }];                // 앞표지
    for (var i = 1; i < srcs.length; i++) out.push({ src:srcs[i], half:null, file:i });
    out.push({ src:srcs[0], half:"left", file:0 });                   // 뒤표지(판권)
    return out;
  }

  function render(){
    stage.innerHTML = "";
    var pg = pages[idx];
    // 반쪽 페이지는 세로(3:4), 펼침면은 가로(3:2).
    stage.className = "stage " + (pg.half ? "single" : "spread");
    var p = document.createElement("div"); p.className = "page";
    if (pg.half) {
      var h = document.createElement("div"); h.className = "half " + pg.half;
      h.style.backgroundImage = 'url("' + pg.src + '")';
      p.appendChild(h);
    } else {
      var img = document.createElement("img"); img.src = pg.src; img.alt = "page " + (idx+1);
      p.appendChild(img);
    }
    stage.appendChild(p);
    el("counter").textContent = (idx+1) + " / " + pages.length;
    panX = 0; panY = 0;                    // 위치만 가운데로(배율은 보던 대로 유지)
    if (zoomMode === "fit") zoom = 1;
    applyZoom();

  }

  // ── 크기 조절(확대·축소·이동) ─────────────────────────────────────────
  //   · 버튼 ＋/－(5%씩), 마우스 휠, 두 손가락, 두 번 톡(더블탭)
  //   · 확대한 상태에서 한 손가락으로 끌면 그림이 움직인다(쪽 넘김 대신).
  //   · 보는 방식(맞춤/가로 맞춤/직접 배율)은 쪽을 넘겨도 이어진다.
  var zoom = 1, panX = 0, panY = 0, zoomMode = "fit";
  var ZMIN = 1, ZMAX = 5, STEP = 0.05;

  function curEl(){ return stage.querySelector(".page img, .page .half"); }

  function applyZoom(){
    var t = curEl(); if (!t) return;
    var lim = Math.max(0, (zoom - 1) * 0.5);
    var box = stage.getBoundingClientRect();
    var w = box.width || 600, h = box.height || 400;
    panX = Math.max(-lim * w, Math.min(lim * w, panX));
    panY = Math.max(-lim * h, Math.min(lim * h, panY));
    t.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
    t.classList.toggle("zoomed", zoom > 1);
    el("zoomPct").textContent = Math.round(zoom * 100) + "%";
  }
  function setZoom(z){
    var next = Math.max(ZMIN, Math.min(ZMAX, z));
    if (next === 1) { panX = 0; panY = 0; }
    zoom = Math.round(next * 1000) / 1000; applyZoom();
  }
  function resetZoom(){ zoom = 1; panX = 0; panY = 0; applyZoom(); }

  /// 가로에 맞추기 — 그림 좌우 흰 여백을 없애고 판 너비를 꽉 채운다.
  function fitWidth(){
    var img = stage.querySelector(".page img");
    var box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    if (!img || !img.naturalWidth) { setZoom(1); return; }   // 반쪽 면은 이미 꽉 차 있다
    var shown = Math.min(box.width, box.height * (img.naturalWidth / img.naturalHeight));
    if (shown <= 0) return;
    panX = 0; panY = 0;
    setZoom(box.width / shown);
  }

  el("zoomIn").addEventListener("click", function(){ zoomMode = "manual"; setZoom(zoom + STEP); });
  el("zoomOut").addEventListener("click", function(){ zoomMode = "manual"; setZoom(zoom - STEP); });
  el("zoomFit").addEventListener("click", function(){ zoomMode = "fit"; resetZoom(); });
  el("zoomWide").addEventListener("click", function(){ zoomMode = "wide"; fitWidth(); });

  stage.addEventListener("wheel", function(e){
    e.preventDefault(); zoomMode = "manual";
    setZoom(zoom + (e.deltaY < 0 ? STEP : -STEP));
  }, { passive:false });
  stage.addEventListener("dblclick", function(){
    if (zoom > 1) { zoomMode = "fit"; resetZoom(); } else { zoomMode = "manual"; setZoom(2.2); }
  });
  var dragging = false, mx = 0, my = 0;
  stage.addEventListener("mousedown", function(e){
    if (zoom <= 1) return;
    dragging = true; mx = e.clientX; my = e.clientY; e.preventDefault();
  });
  window.addEventListener("mousemove", function(e){
    if (!dragging) return;
    panX += e.clientX - mx; panY += e.clientY - my; mx = e.clientX; my = e.clientY; applyZoom();
  });
  window.addEventListener("mouseup", function(){ dragging = false; });

  function go(dir){
    if (animating) return;
    var ni = idx + dir;
    if (ni < 0 || ni >= pages.length) return;
    animating = true;
    var cur = stage.querySelector(".page");
    if (dir > 0 && cur) { cur.classList.add("flipping"); }
    setTimeout(function(){ idx = ni; render(); animating = false; }, dir > 0 ? 360 : 0);
  }

  el("prev").addEventListener("click", function(){ go(-1); });
  el("next").addEventListener("click", function(){ go(1); });

  // 스와이프(쪽 넘김) + 두 손가락 확대 + 확대 중 끌어 옮기기
  var sx = 0, sy = 0, pinchStart = 0, zoomStart = 1, panning = false, lastTap = 0;
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
                    return Math.sqrt(dx * dx + dy * dy); }
  stage.parentElement.addEventListener("touchstart", function(e){
    if (e.touches.length === 2) { pinchStart = dist(e.touches); zoomStart = zoom; panning = false; }
    else {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      panning = zoom > 1;
      var now = Date.now();
      if (now - lastTap < 300) {
        if (zoom > 1) { zoomMode = "fit"; resetZoom(); } else { zoomMode = "manual"; setZoom(2.2); }
      }
      lastTap = now;
    }
  }, {passive:true});
  stage.parentElement.addEventListener("touchmove", function(e){
    if (e.touches.length === 2 && pinchStart > 0) {
      e.preventDefault(); zoomMode = "manual";
      setZoom(zoomStart * (dist(e.touches) / pinchStart));
    } else if (panning && e.touches.length === 1) {
      e.preventDefault();
      panX += e.touches[0].clientX - sx; panY += e.touches[0].clientY - sy;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      applyZoom();
    }
  }, {passive:false});
  stage.parentElement.addEventListener("touchend", function(e){
    if (pinchStart > 0 && e.touches.length < 2) { pinchStart = 0; return; }
    if (panning) { panning = false; return; }
    if (zoom > 1) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1);
  });

  function loadClass(){
    show("loading");
    fetch(API + "?class=" + encodeURIComponent(classId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { show("error"); return; }
        if (!d.books || !d.books.length) {           // 주소는 맞지만 이 반에 게시된 책이 0권
          el("emptyHint").textContent = "반코드: " + classId + " · 앱에서 ‘온라인 갤러리에 올리기’로 책을 올리면 여기에 나와요.";
          show("empty"); return;
        }
        var grid = el("grid"); grid.innerHTML = "";
        d.books.forEach(function(b){
          var card = document.createElement("div"); card.className = "bookcard";
          card.innerHTML = '<img src="' + (b.cover || "") + '" alt=""><div class="cap"><div class="t">'
            + (b.title || "제목 없음") + '</div><div class="s">' + (b.student || "") + '</div></div>';
          // 반코드를 함께 넘겨야 책에서 '리스트로 돌아가기'가 이 반 목록으로 돌아온다.
          card.addEventListener("click", function(){
            location.href = "?book=" + encodeURIComponent(b.bookId) + "&class=" + encodeURIComponent(classId);
          });
          grid.appendChild(card);
        });
        show("class");
      })
      .catch(function(){ show("error"); });
  }

  function loadBook(){
    show("loading");
    fetch(API + "?book=" + encodeURIComponent(bookId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok || !d.pages || !d.pages.length) { show("error"); return; }
        d.pages.forEach(function(u){ var im = new Image(); im.src = u; });
        pages = buildPages(d.pages);
        idx = 0; render(); show("book");
      })
      .catch(function(){ show("error"); });
  }

  // 목록으로 — 반코드를 알면 그 반 갤러리로, 모르면 브라우저 뒤로.
  //   · 뷰어의 '우리 반 문집' 목록에서 들어왔으면 그 목록으로,
  //   · 갤러리에서 들어왔으면 갤러리 그 반 페이지(./?class=…)로 돌아간다.
  el("backlist").addEventListener("click", function(){
    if (!classId) { history.back(); return; }
    // 뷰어의 '우리 반 문집' 목록 주소는 viewer.html?class=… 하나뿐이다.
    // 그냥 'viewer.html'로만 보면 새로고침(자기 자신)도 걸려 엉뚱한 곳으로 간다.
    var fromViewerList = (document.referrer || "").indexOf("viewer.html?class=") >= 0;
    location.href = (fromViewerList ? "viewer.html?class=" : "./?class=") + encodeURIComponent(classId);
  });

  // ── 관리자: 이 쪽 그림만 새 파일로 갈아 끼우기 ─────────────────────────
  //   · 자물쇠를 눌러 비밀번호를 넣어야 버튼이 나온다(부모님께 보내는 링크에선 안 보임).
  //   · 옛 그림은 드라이브 휴지통으로 가므로 잘못 바꿔도 30일 안에 되돌릴 수 있다.
  var SECRET = "artclasshub-storybook";
  var adminKey = "";

  el("lockBtn").addEventListener("click", function(){
    if (adminKey) {
      adminKey = ""; el("swapBtn").hidden = true; el("saveViewBtn").hidden = true;
      el("lockBtn").textContent = "🔒"; document.body.classList.remove("admin");
      zoomMode = "fit"; resetZoom();
      return;
    }
    var pw = window.prompt("관리자 비밀번호를 넣어 주세요");
    if (!pw) return;
    adminKey = pw; el("lockBtn").textContent = "🔓";
    el("swapBtn").hidden = !bookId; el("saveViewBtn").hidden = !bookId;
    document.body.classList.add("admin");
  });
  el("swapBtn").addEventListener("click", function(){ el("swapFile").value = ""; el("swapFile").click(); });

  function shrink(file, maxSide){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(null); return; }
        var cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function(b){ resolve(b); }, "image/jpeg", 0.92);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }
  function toBase64(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
      r.onerror = reject; r.readAsDataURL(blob);
    });
  }

  /// 서버에 쪽 그림 교체 요청. 구글 서버가 가끔 JSON 대신 안내 HTML을 돌려주는데,
  /// 그럴 땐 한 번 더 시도한다(대개 다음 번엔 성공).
  function sendReplace(page, base64, mime, tries){
    tries = tries || 0;
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "replacePage", secret: SECRET, adminKey: adminKey,
                             bookId: bookId, page: page, dataBase64: base64, mimeType: mime })
    })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var d = null;
        try { d = JSON.parse(t); } catch (e) {}
        if (!d) {                                    // JSON이 아니면(안내 HTML 등) 한 번 더
          if (tries < 1) return new Promise(function(res){ setTimeout(res, 1200); })
                                .then(function(){ return sendReplace(page, base64, mime, tries + 1); });
          throw new Error("서버가 잠깐 응답을 못했어요. 잠시 뒤 다시 해주세요.");
        }
        if (!d.ok) throw new Error(d.error || "실패");
        return d;
      });
  }

  /// 교체 성공 뒤 화면 갱신(주소에 시각을 붙여 옛 그림 캐시를 피한다).
  function applyNewPages(list){
    var t = Date.now();
    pages = buildPages(list.map(function(u){ return u + (u.indexOf("?") < 0 ? "?" : "&") + "t=" + t; }));
    idx = Math.min(idx, pages.length - 1);
    zoomMode = "fit"; resetZoom();
    render();
  }

  /// 버튼을 잠그고 되돌리는 잔일.
  function busy(btn, on, label){
    btn.disabled = on;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
    else if (btn.dataset.label) { btn.textContent = btn.dataset.label; }
  }

  el("swapFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if (!file || !bookId || !pages[idx]) return;
    var btn = el("swapBtn");
    busy(btn, true, "⏳ 올리는 중…");
    // 화면의 쪽 번호가 아니라 '원본 파일 번호'로 바꾼다(표지는 앞·뒤가 한 파일).
    var page = (pages[idx].file || 0) + 1;
    shrink(file, 3000)                     // A2 인쇄를 견디게(1600이면 137dpi밖에 안 나온다)
      .then(function(small){ return toBase64(small || file).then(function(b64){
        return { b64: b64, mime: small ? "image/jpeg" : (file.type || "image/jpeg") }; }); })
      .then(function(x){ return sendReplace(page, x.b64, x.mime); })
      .then(function(d){ applyNewPages(d.pages); })
      .catch(function(err){ alert("그림을 바꾸지 못했어요: " + (err && err.message ? err.message : err)); })
      .then(function(){ busy(btn, false); });
  });

  /// 지금 화면에 보이는 그대로(확대·이동 반영) 이 쪽 그림을 다시 만들어 저장한다.
  ///   · 펼침면: 판 전체를 그대로 다시 그린다.
  ///   · 표지 반쪽(앞표지/뒤표지): 원본 표지 한 장을 그대로 두고 **보고 있는 반쪽만** 갈아 끼운다.
  el("saveViewBtn").addEventListener("click", function(){
    var pg = pages[idx];
    if (!pg || !bookId) return;
    var box = stage.getBoundingClientRect();
    if (!box.width || !box.height) { alert("화면 크기를 읽지 못했어요."); return; }

    var btn = el("saveViewBtn");
    busy(btn, true, "⏳ 저장 중…");

    var src = new Image();
    src.crossOrigin = "anonymous";                  // 캔버스가 막히지 않게
    src.onerror = function(){ alert("그림을 다시 불러오지 못했어요."); busy(btn, false); };
    src.onload = function(){
      var natW = src.naturalWidth, natH = src.naturalHeight;
      var cv = document.createElement("canvas");
      var ctx;
      if (!pg.half) {
        // ── 펼침면: 판 비율 그대로, 원본 가로 해상도로 다시 그린다.
        cv.width = natW; cv.height = Math.round(natW * (box.height / box.width));
        ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        var k = cv.width / box.width;
        var ar = natW / natH;
        var dw = Math.min(box.width, box.height * ar), dh = dw / ar;
        var w = dw * zoom * k, h = dh * zoom * k;
        var cx = (box.width / 2 + panX) * k, cy = (box.height / 2 + panY) * k;
        ctx.drawImage(src, cx - w / 2, cy - h / 2, w, h);
      } else {
        // ── 표지 반쪽: 표지 한 장을 통째로 다시 만들되, 손댄 반쪽만 새로 그린다.
        cv.width = natW; cv.height = natH;
        ctx = cv.getContext("2d");
        ctx.drawImage(src, 0, 0, natW, natH);        // 나머지 반쪽은 원래 그대로
        var hw = natW / 2;
        var hx = (pg.half === "right") ? hw : 0;     // 손대는 반쪽의 시작 x
        var kk = hw / box.width;                     // 화면 → 저장 픽셀
        ctx.save();
        ctx.beginPath(); ctx.rect(hx, 0, hw, natH); ctx.clip();
        ctx.fillStyle = "#fff"; ctx.fillRect(hx, 0, hw, natH);
        var dw2 = hw * zoom, dh2 = natH * zoom;
        var cx2 = hx + hw / 2 + panX * kk, cy2 = natH / 2 + panY * kk;
        ctx.drawImage(src, hx, 0, hw, natH, cx2 - dw2 / 2, cy2 - dh2 / 2, dw2, dh2);
        ctx.restore();
      }

      cv.toBlob(function(blob){
        if (!blob) { alert("그림을 만들지 못했어요."); busy(btn, false); return; }
        toBase64(blob)
          .then(function(b64){ return sendReplace((pg.file || 0) + 1, b64, "image/jpeg"); })
          .then(function(d){ applyNewPages(d.pages); })
          .catch(function(err){ alert("저장하지 못했어요: " + (err && err.message ? err.message : err)); })
          .then(function(){ busy(btn, false); });
      }, "image/jpeg", 0.92);
    };
    src.src = pg.src;            // 표지 반쪽도 원본은 '표지 한 장' 주소다
  });

  function load(){
    if (!API || API.indexOf("PASTE") === 0) { show("error"); return; }
    // book이 있으면 책 우선(주소에 class가 같이 붙어 있어도 책을 연다).
    if (bookId) {
      el("backlist").hidden = !(classId || document.referrer);
      loadBook();
    }
    else if (classId) loadClass();
    else show("error");
  }
  load();
</script>
</body>
</html>
