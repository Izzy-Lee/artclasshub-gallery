<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림책 인쇄 요청 🖨</title>
<style id="pageCss">@page { size:420mm 297mm; margin:0; }</style>
<style>
  :root { --pink:#F35AA0; --bg:#F1F1F6; --ink:#2b2b30; --dim:#8a8a92; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
              font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }

  /* 위 도구 모음 — 스크롤해도 붙어 있되 자리는 차지한다(가려지지 않게). 인쇄할 땐 숨긴다. */
  #bar { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.97);
         box-shadow:0 2px 12px rgba(0,0,0,.07); padding:10px 14px 12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row + .row { margin-top:9px; }
  .t { font-weight:800; color:var(--pink); margin-right:2px; }
  .lab { font-size:12px; font-weight:800; color:var(--dim); margin-right:2px; }
  .hint { color:var(--dim); font-size:12px; }
  .grow { margin-left:auto; }
  button, a.btn { border:0; border-radius:999px; padding:9px 14px; font-size:13px; font-weight:700;
                  cursor:pointer; background:var(--pink); color:#fff; text-decoration:none; font-family:inherit; }
  button.ghost, a.btn.ghost { background:#eceef3; color:#666; }
  button[disabled] { opacity:.5; cursor:default; }

  /* 용지 고르기 — 앱과 같은 알약 모양 한 줄 */
  .seg { display:inline-flex; background:#eceef3; border-radius:999px; padding:4px; gap:2px; }
  .seg button { background:transparent; color:#6a6a72; padding:8px 13px; }
  .seg button.on { background:#fff; color:#1c1c20; box-shadow:0 1px 4px rgba(0,0,0,.14); }

  /* 책 이름 — 앱의 맨 윗줄과 같은 자리 */
  #bookcard { max-width:760px; margin:16px auto 0; padding:0 14px; }
  #bookTitle { font-size:15px; font-weight:800; color:var(--dim); padding-left:4px; }
  #bookWho { margin-top:8px; background:#fff; border-radius:16px; padding:15px 18px;
             font-size:15px; font-weight:600; color:#55555c; }

  #msg { padding:80px 20px; text-align:center; color:#9a7; font-size:17px; line-height:1.6; }
  #sheetsTitle { max-width:760px; margin:22px auto 0; padding:0 18px; font-size:15px; font-weight:800; color:var(--dim); }
  #sheets { padding:12px 12px 30px; display:flex; flex-direction:column; align-items:center; }
  /* 한 장(.page)은 인쇄 크기(mm) 그대로 두고 화면에서만 줄인다.
     줄여도 자리는 원래 크기만큼 차지하므로(transform 은 자리를 안 줄인다)
     종이를 흐름 밖으로 빼고(absolute) 바깥 상자(.slot)를 줄어든 크기로 맞춘다. */
  .slot { position:relative; flex:0 0 auto; margin-bottom:36px; }
  .page { position:absolute; top:0; left:0; background:#fff; overflow:hidden; transform-origin:top left;
          box-shadow:0 8px 26px rgba(0,0,0,.13); }
  .clip { position:absolute; overflow:hidden; }
  .clip img { position:absolute; display:block; }
  .clip img.flip { transform:rotate(180deg); }        /* 뒤집힌 칸(윗줄) */
  /* 접는·자르는 선 — 인쇄에도 함께 나온다(배경색이 아니라 테두리라 '배경 그래픽' 설정과 무관). */
  .guide { position:absolute; }
  .guide.v { top:0; bottom:0; border-left:0.15mm dashed rgba(0,0,0,.2); }
  .guide.h { left:0; right:0; border-top:0.15mm dashed rgba(0,0,0,.2); }
  .cap { position:absolute; top:100%; left:0; right:0; margin-top:8px;
         text-align:center; color:#a5a5ad; font-size:12px; font-weight:700; }

  #mobHint { display:none; }
  @media (max-width: 620px) {
    #mobHint { display:inline; }
    #bar { padding:8px 10px 10px; }
    button, a.btn { padding:8px 11px; font-size:12px; }
    .seg button { padding:7px 9px; font-size:12px; }
    .hint { font-size:11px; }
    .grow { margin-left:0; }
  }

  @media print {
    html,body { background:#fff; }
    #bar, #msg, #bookcard, #sheetsTitle { display:none !important; }
    #sheets { padding:0; display:block; }
    .slot { position:static; width:auto !important; height:auto !important; margin:0;
            break-after:page; page-break-after:always; }
    .slot:last-child { break-after:auto; page-break-after:auto; }
    /* 종이를 다시 흐름 안에 놓되 relative 는 지킨다 — static 으로 두면 안에 얹은 그림이
       종이가 아니라 화면 전체를 기준으로 자리를 잡아 엉뚱한 곳이 인쇄된다. */
    .page { position:relative !important; transform:none !important; box-shadow:none; }
    .cap { display:none !important; }
  }
</style>
</head>
<body>
<div id="bar" hidden>
  <div class="row">
    <span class="t">인쇄 요청 🖨</span>
    <button id="pdfBtn">📥 PDF 파일 받기</button>
    <button id="printBtn" class="ghost">🖨 프린트</button>
    <a id="backBtn" class="btn ghost" href="#">‹ 그림책으로</a>
    <a id="listBtn" class="btn ghost" href="#">‹ 리스트로</a>
    <span id="dpi" class="hint grow"></span>
  </div>
  <div class="row">
    <span class="lab">용지</span>
    <span class="seg" id="paperSeg">
      <button data-p="a3">A3 원본</button>
      <button data-p="a4">A4 축소</button>
      <button data-p="a4x2">A4 2장 분할</button>
      <button data-p="a2">A2 전시용</button>
    </span>
    <button id="fitBtn" class="ghost" title="자동 채움: 안 잘리고 빈 자리도 없게 · 안 잘리게: 흰 여백을 남김 · 종이 꽉: 가장자리가 잘림">그림: 자동 채움</button>
    <button id="trimBtn" class="ghost" title="그림에 같이 저장된 회색 그림자·검은 실선 테두리를 빼고 뽑습니다">테두리: 정리</button>
    <button id="guideBtn" class="ghost" title="접고 자를 자리를 알려 주는 점선">접는 선: 보임</button>
  </div>
  <div class="row"><span id="note" class="hint"></span></div>
  <div class="row"><span id="mobHint" class="hint">휴대폰: ‘프린트’ → PDF 가 열리면 공유(⬆︎) → ‘프린트’ · 카톡·인스타 안에서 열었다면 먼저 ‘사파리로 열기’</span></div>
</div>
<div id="bookcard" hidden>
  <div id="bookTitle">그림책</div>
  <div id="bookWho"></div>
</div>
<div id="msg">인쇄용으로 조판하는 중… 🖨</div>
<div id="sheetsTitle" hidden>조판 미리보기</div>
<div id="sheets" hidden></div>
<script>
  var API = "https://script.google.com/macros/s/AKfycbzBg9ghzZSLv0J3MlUWMNVscBQuKVd2JgYS-HyiBAuqzPEh5qbGCUW9o_PorKOILx4/exec";
  var qp = new URLSearchParams(location.search);
  var bookId = qp.get("book");
  var classId = qp.get("class") || "";
  var el = function(id){ return document.getElementById(id); };

  // ── 무엇을 어떻게 뽑을지 ───────────────────────────────────────────────
  //   paper  a3   = A3 가로 한 장(접어서 만드는 8쪽 그림책) ← 앱의 '원본'
  //          a4   = 같은 조판을 A4 가로 한 장으로 줄여서
  //          a4x2 = 같은 조판을 A4 세로 두 장으로 나눠서(붙이면 A3)
  //          a2   = A2 가로 한 장에 8쪽을 쭉 펼친 전시용(접지 아님)
  //   fit    fill = 칸을 꽉 채움(가장자리 조금 잘림) · fit = 그림 전체 보임(흰 여백)
  //   trimOn 그림 파일에 같이 저장된 회색 그림자 띠·검은 실선을 빼고 뽑는다
  //   guides 접고 자를 자리를 알려 주는 점선
  function pref(k, d){ try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function prefSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  // 브라우저 '프린트'로 뽑을 때 판을 종이 안쪽으로 아주 조금 들여 앉힌다.
  //   프린터는 종이 가장자리 몇 mm 를 못 찍는다(하드웨어 여백). 브라우저는 '찍을 수
  //   있는 칸'에 폭을 맞춰 줄이는데, 가로 판(A3·A4 가로)은 그러면 세로가 1~5% 넘쳐
  //   맨 아랫줄이 둘째 장으로 넘어간다(휴대폰에서 2/2쪽이 생기던 이유).
  //   세로 판(A4 2장)은 반대로 세로가 남으므로 거의 줄일 게 없다.
  //   줄인 만큼은 위·아래로 나눠 가운데에 앉힌다 — 한쪽으로 몰린 흰 띠가 안 생긴다.
  //   PDF 파일은 손대지 않는다 — 인쇄소에는 PDF 를 주면 크기가 정확하다.
  //     s = 판 크기 · t = 위에서 내려 앉히는 양(세로 비율)
  //     가로: 0.013 + 0.95 = 0.963 → 가장자리 12mm 못 찍는 프린터까지 한 장
  //     세로: 0.020 + 0.97 = 0.990 → 세로 판은 원래 여유가 있다
  var PRINT_INSET = { land:{ s:0.95, t:0.013 }, port:{ s:0.97, t:0.020 } };
  // 접는 선 모양(PDF) — 굵기(pt) · 회색(0 검정 ~ 1 흰색) · 점선 길이·사이(pt)
  //   0.3pt 보다 얇으면 프린터마다 들쭉날쭉 찍히므로 0.4pt 를 아래한계로 둔다.
  var GUIDE = { w: 0.4, gray: 0.75, dash: "1.5 3" };
  var PAPERS = ["a3", "a4", "a4x2", "a2"];
  // 기본은 앱과 같은 'A4 축소' — 집·학교 프린터에 든 종이가 대개 A4 라 종이와 판이 맞는다.
  var paper = PAPERS.indexOf(pref("printPaper2", "a4")) >= 0 ? pref("printPaper2", "a4") : "a4";
  //   extend 자동 채움(기본) — 그림은 한 점도 안 자르고, 남는 띠만 가장자리 그림을
  //                             늘려 메운다. 잘리지도, 비지도 않는다.
  //   whole  안 잘리게        — 그림 전체를 넣고 남는 자리는 흰 여백으로 둔다.
  //   fill   종이 꽉          — 칸을 꽉 채우되 가장자리가 조금 잘린다.
  var FITS = ["extend", "whole", "fill"];
  var fitMode = FITS.indexOf(pref("printFit2", "extend")) >= 0 ? pref("printFit2", "extend") : "extend";
  var trimOn = pref("printTrim", "1") !== "0";
  var guidesOn = pref("printGuide", "1") !== "0";

  var srcUrls = [];        // 원본 그림 주소(앱이 올린 파일 순서: 표지 · 1-2쪽 · 3-4쪽 · 5-6쪽)
  var imgs = [];           // 화면에 쓸 Image 객체
  var meta = [];           // 그림마다 { w, h, trim:{l,t,r,b}, seam }
  var pixelsReadable = true;
  var bookName = "그림책";

  // ── 그림 불러오기 ──────────────────────────────────────────────────────
  //   픽셀을 읽어야 테두리·이음매를 찾을 수 있어 crossOrigin 으로 먼저 시도하고,
  //   막히면 그냥 불러온다(그리기는 되므로 인쇄는 그대로 된다).
  function loadImage(u){
    return new Promise(function(res){
      var a = new Image(); a.crossOrigin = "anonymous";
      a.onload = function(){ res(a); };
      a.onerror = function(){
        var b = new Image();
        b.onload = function(){ res(b); };
        b.onerror = function(){ res(null); };
        b.src = u;
      };
      a.src = u;
    });
  }

  // ── 그림 파일에 같이 저장된 테두리 찾기 ────────────────────────────────
  //   어떤 쪽은 종이 카드의 회색 그림자 띠와 검은 실선까지 그림 안에 찍혀 있다.
  //   테두리는 '한 줄 안에서 색이 거의 변하지 않는다'는 점으로 알아본다.
  //   (뷰어·전시용 A2 와 같은 방식 — 원본 파일은 건드리지 않고 인쇄에서만 뺀다)
  function lineStat(d, W, H, side, n){
    var horiz = (side === "l" || side === "r");
    var lines = horiz ? W : H, across = horiz ? H : W;
    var i = (side === "l" || side === "t") ? n : lines - 1 - n;
    var sum = 0, sum2 = 0, cnt = 0;
    for (var j = 0; j < across; j += 3) {
      var o = (horiz ? (j * W + i) : (i * W + j)) * 4;
      var g = (d[o] + d[o + 1] + d[o + 2]) / 3;
      sum += g; sum2 += g * g; cnt++;
    }
    var m = sum / cnt;
    return { mean: m, sd: Math.sqrt(Math.max(0, sum2 / cnt - m * m)) };
  }
  function borderRun(d, W, H, side){
    var lines = (side === "l" || side === "r") ? W : H;
    var cap = Math.round(lines * 0.12);       // 테두리는 얇다. 이보다 넓으면 그림의 일부로 본다.
    var n = 0;
    while (n < cap && lineStat(d, W, H, side, n).sd < 22) n++;
    if (n >= cap) n = 0;                      // 넓은 단색 면 = 일부러 비워 둔 배경
    for (var k = 0; k < 3; k++) {             // 남은 1~2px 실선까지 마저 벗긴다
      if (n + 4 >= lines) break;
      if (Math.abs(lineStat(d, W, H, side, n).mean - lineStat(d, W, H, side, n + 3).mean) > 55) n++;
      else break;
    }
    if (!n) return 0;
    var edge = lineStat(d, W, H, side, 0).mean;
    var inside = lineStat(d, W, H, side, Math.min(lines - 1, n + 2)).mean;
    // ① 종이보다 밝은 띠는 아이가 일부러 남긴 여백이다 — 손대지 않는다.
    //    다만 1~3px짜리 새하얀 실선은 잘라 내야 종이에서 흰 줄로 남지 않는다.
    if (edge >= 225) return (n <= 3 && Math.abs(inside - edge) > 45) ? n : 0;
    // ② 어두운 테두리는 안쪽 그림과 뚝 끊긴다. 깊은 바다색 같은 어두운 그림은
    //    안쪽으로 색이 이어지므로 여기서 걸러진다(그건 아이 그림이다).
    var darkest = 255;
    for (var q = 0; q < n; q++) darkest = Math.min(darkest, lineStat(d, W, H, side, q).mean);
    if (inside - darkest <= 45) return 0;
    return n;
  }

  /// 그림 한가운데의 '거의 흰 세로 띠'(두 쪽 사이 여백)를 찾아 그 한가운데 x를 돌려준다.
  /// 전시용처럼 반쪽씩 쓸 때 실제 이음매가 절반이 아니면 한쪽 그림이 잘리기 때문이다.
  function seamCenter(img, W, H){
    var mid = Math.round(W / 2);
    var band = Math.round(W * 0.12);                       // 가운데 ±12%만 살펴본다
    var x0 = Math.max(0, mid - band), x1 = Math.min(W - 1, mid + band);
    var cw = x1 - x0 + 1, ch = Math.min(H, 360);           // 세로는 360줄로 줄여 빠르게
    var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    var ctx = cv.getContext("2d", { willReadFrequently: true });
    var data;
    try {
      ctx.drawImage(img, x0, 0, cw, H, 0, 0, cw, ch);
      data = ctx.getImageData(0, 0, cw, ch).data;
    } catch (e) { return mid; }
    var energy = new Array(cw).fill(0);
    for (var x = 1; x < cw; x++) {
      var sum = 0;
      for (var y = 0; y < ch; y++) {
        var i = (y * cw + x) * 4, j = (y * cw + (x - 1)) * 4;
        sum += Math.abs(data[i] - data[j]) + Math.abs(data[i+1] - data[j+1]) + Math.abs(data[i+2] - data[j+2]);
      }
      energy[x] = sum / ch;
    }
    energy[0] = energy[1] || 0;
    var FLAT = 2.0;
    var flat = energy.map(function(e){ return e <= FLAT; });
    var c = mid - x0;
    if (!flat[c]) return mid;                              // 한가운데에 그림이 걸쳐 있으면 거기가 곧 이음매
    var a = c, b = c;
    while (a - 1 >= 0 && flat[a - 1]) a--;
    while (b + 1 < cw && flat[b + 1]) b++;
    if ((b - a + 1) > cw * 0.6) return mid;                // 너무 넓은 평지는 이음매로 보기 어렵다
    var center = x0 + Math.round((a + b) / 2);
    if (Math.abs(center - mid) > W * 0.10) center = mid;   // 너무 멀면 믿지 않는다
    return center;
  }

  /// 그림 하나를 살펴 테두리 두께와 이음매를 적어 둔다(한 번만).
  function measure(img){
    var W = img.naturalWidth, H = img.naturalHeight;
    var info = { w:W, h:H, trim:{ l:0, t:0, r:0, b:0 }, seam: Math.round(W / 2) };
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d", { willReadFrequently: true });
    var d;
    try { ctx.drawImage(img, 0, 0); d = ctx.getImageData(0, 0, W, H).data; }
    catch (e) { pixelsReadable = false; return info; }
    var L = borderRun(d, W, H, "l"), R = borderRun(d, W, H, "r");
    var T = borderRun(d, W, H, "t"), B = borderRun(d, W, H, "b");
    // 너무 많이 잘라 내면(그림의 절반 넘게) 잘못 본 것이므로 그만둔다.
    if (W - L - R >= W * 0.5 && H - T - B >= H * 0.5) info.trim = { l:L, t:T, r:R, b:B };
    info.seam = seamCenter(img, W, H);
    return info;
  }

  /// 칸에 남는 띠를, 안쪽 그림을 '점점 더' 늘려서 메운다.
  ///   안쪽(그림이 시작되는 선)에서는 하나도 안 늘리고 바깥으로 갈수록 늘어난다.
  ///   → 늘리기 시작하는 자리에 꺾인 자국이 없고, 색도 선도 그대로 이어진다.
  ///   (전시용 A2·뷰어의 '여백 채우기'와 같은 방식)
  function pushOut(ctx, cw, ch, side, gap){
    gap = Math.round(gap);
    if (gap < 1) return;
    var horiz = (side === "l" || side === "r");
    var lines  = horiz ? cw : ch;                 // 늘리는 방향의 길이
    var across = horiz ? ch : cw;                 // 그 반대 방향
    var band = Math.max(24, Math.min(gap * 7, Math.round((lines - 2 * gap) * 0.35)));
    var near = (side === "l" || side === "t");
    if (band < 8 || gap + band > lines) return;
    var p0    = near ? 0 : lines - gap - band;    // 다시 그릴 구간의 시작
    var inner = near ? (gap + band) : (lines - gap - band);   // 늘리기 시작하는 안쪽 선
    var wid = band + gap;
    var sd;
    try {
      sd = (horiz ? ctx.getImageData(p0, 0, wid, across) : ctx.getImageData(0, p0, across, wid)).data;
    } catch (e) {
      // 픽셀을 못 읽는 그림 — 가장자리 한 줄을 늘려 덮는 것으로 갈음한다.
      var self = ctx.canvas;
      if (side === "t")      ctx.drawImage(self, 0, gap, cw, 1, 0, 0, cw, gap + 1);
      else if (side === "b") ctx.drawImage(self, 0, ch - gap - 1, cw, 1, 0, ch - gap, cw, gap + 1);
      else if (side === "l") ctx.drawImage(self, gap, 0, 1, ch, 0, 0, gap + 1, ch);
      else                   ctx.drawImage(self, cw - gap - 1, 0, 1, ch, cw - gap, 0, gap + 1, ch);
      return;
    }
    var out = horiz ? ctx.createImageData(wid, across) : ctx.createImageData(across, wid);
    var od = out.data;
    for (var P = 0; P < wid; P++) {
      var d = near ? (inner - (p0 + P)) : ((p0 + P) - inner);
      var u = (-band + Math.sqrt(band * band + 4 * gap * d)) / (2 * gap);
      u = Math.max(0, Math.min(1, u));
      // 맨 끝 2px 은 흐릿하게 번진 자국이라 색을 뽑는 데 쓰지 않는다.
      var sf = (near ? (inner - u * (band - 2)) : (inner + u * (band - 2))) - p0;
      var i0 = Math.max(0, Math.min(wid - 1, Math.floor(sf)));
      var i1 = Math.max(0, Math.min(wid - 1, i0 + 1));
      var f = sf - i0;
      for (var J = 0; J < across; J++) {
        var a = (horiz ? (J * wid + i0) : (i0 * across + J)) * 4;
        var b = (horiz ? (J * wid + i1) : (i1 * across + J)) * 4;
        var o = (horiz ? (J * wid + P)  : (P * across + J)) * 4;
        od[o]     = sd[a]     + (sd[b]     - sd[a])     * f;
        od[o + 1] = sd[a + 1] + (sd[b + 1] - sd[a + 1]) * f;
        od[o + 2] = sd[a + 2] + (sd[b + 2] - sd[a + 2]) * f;
        od[o + 3] = 255;
      }
    }
    if (horiz) ctx.putImageData(out, p0, 0); else ctx.putImageData(out, 0, p0);
  }

  /// 칸 하나를 '잘리지도, 비지도' 않게 새로 그려 둔다.
  ///   ① 그림 전체를 칸 안에 넣고(한 점도 안 잘리게)
  ///   ② 남는 띠만 가장자리 그림을 늘려 메운다
  ///   원본 해상도 그대로 그리므로 그림이 흐려지지 않는다.
  var extCache = {};
  function extendCell(cell){
    var crop = cell.crop, b = cell.box;
    var key = [cell.file, cell.half || "-", Math.round(b.w / b.h * 1000), trimOn ? 1 : 0].join("|");
    if (extCache[key]) return extCache[key];
    var boxAR = b.w / b.h, imgAR = crop.w / crop.h;
    var cw, ch;
    if (imgAR >= boxAR) { cw = Math.round(crop.w); ch = Math.round(crop.w / boxAR); }
    else { ch = Math.round(crop.h); cw = Math.round(crop.h * boxAR); }
    var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    var ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
    var s = Math.min(cw / crop.w, ch / crop.h);
    var dw = crop.w * s, dh = crop.h * s, dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    ctx.drawImage(imgs[cell.file], crop.x, crop.y, crop.w, crop.h, dx, dy, dw, dh);
    pushOut(ctx, cw, ch, "l", dx);            pushOut(ctx, cw, ch, "r", cw - (dx + dw));
    pushOut(ctx, cw, ch, "t", dy);            pushOut(ctx, cw, ch, "b", ch - (dy + dh));
    var url;
    try { url = cv.toDataURL("image/jpeg", 0.95); }
    catch (e) { return null; }                // 픽셀을 못 읽는 그림이면 채우지 않는다
    extCache[key] = { url:url, w:cw, h:ch };
    return extCache[key];
  }

  /// 이 그림에서 실제로 쓸 부분(테두리를 뺀 안쪽, 반쪽만 쓸 땐 그 반쪽)
  function cropOf(i, half){
    var m = meta[i];
    var t = trimOn ? m.trim : { l:0, t:0, r:0, b:0 };
    var x = t.l, y = t.t, w = m.w - t.l - t.r, h = m.h - t.t - t.b;
    if (half) {
      var seam = Math.max(x + 8, Math.min(x + w - 8, m.seam));
      if (half === "l") { w = seam - x; }
      else { w = (x + w) - seam; x = seam; }
    }
    return { x:x, y:y, w:w, h:h };
  }

  // ── 조판(장마다 어느 칸에 무엇을 앉힐지) ───────────────────────────────
  //   접지용(A3·A4·A4 2장)은 앱과 같은 배치다.
  //     ┌──────────────┬──────────────┐
  //     │ 1-2쪽 (뒤집힘)│ 3-4쪽 (뒤집힘)│   ← 윗줄은 180° 돌려 앉힌다
  //     ├──────────────┼──────────────┤
  //     │ 5-6쪽        │ 표지(뒤·앞)   │
  //     └──────────────┴──────────────┘
  //   가로세로 반씩 접으면 8쪽짜리 작은 그림책이 된다.

  /// 한 장을 만든다 — 칸을 격자로 늘어놓고 접는 선까지 계산한다.
  ///   items: [{ file, half, rot }] 를 왼쪽 위부터 줄 단위로 채운다(빈 칸은 null).
  ///
  ///   칸 크기는 두 가지로 잡는다.
  ///     · 안 잘리게(기본) — 칸을 그림 비율에 맞춘다. 아이 그림이 한 점도 안 잘리고,
  ///       남는 자리는 종이 위·아래(또는 좌·우) 가장자리로 고르게 보낸다.
  ///       앱 그림은 3:2 인데 A 판 종이는 1.414 라, 칸을 종이에 딱 맞추면
  ///       좌우가 2.9% 씩(합쳐 5.7%) 잘려 나간다 — 가장자리 글씨가 먹힌다.
  ///     · 종이 꽉  — 예전처럼 칸이 종이를 다 채운다(가장자리가 조금 잘린다).
  ///   접는 자리(종이 한가운데)는 두 경우 다 그대로다. 칸을 가운데 정렬하기 때문이다.
  function makeSheet(wmm, hmm, cols, items, label){
    var rows = Math.ceil(items.length / cols);
    var cw = wmm / cols, ch = hmm / rows, ox = 0, oy = 0;
    var crops = items.map(function(it){ return it ? cropOf(it.file, it.half || null) : null; });
    if (fitMode === "whole") {
      // 여러 쪽 중 가장 '세로로 긴' 비율에 맞춰야 모두 안 잘린다.
      var ar = 0;
      crops.forEach(function(c){ if (c) { var a = c.w / c.h; if (!ar || a < ar) ar = a; } });
      if (ar) {
        ch = cw / ar;
        if (ch * rows > hmm) { ch = hmm / rows; cw = ch * ar; }
        ox = (wmm - cw * cols) / 2; oy = (hmm - ch * rows) / 2;
      }
    }
    var cells = [], v = [], h = [];
    items.forEach(function(it, k){
      if (!it) return;
      var c = k % cols, r = Math.floor(k / cols);
      cells.push({ file:it.file, half:it.half || null, rot:it.rot || 0, crop: crops[k],
                   box: { x:ox + c * cw, y:oy + r * ch, w:cw, h:ch } });
    });
    for (var c = 1; c < cols; c++) v.push(ox + c * cw);
    for (var r = 1; r < rows; r++) h.push(oy + r * ch);
    // 펼침면 칸은 한가운데가 쪽과 쪽 사이(접는 자리)다.
    if (!items.some(function(it){ return it && it.half; }))
      for (var c2 = 0; c2 < cols; c2++) v.push(ox + c2 * cw + cw / 2);
    return { w:wmm, h:hmm, cells:cells, guides:{ v:v, h:h }, label:label };
  }

  /// 접지용 — 속지(1-2·3-4·5-6쪽)를 먼저, 표지를 맨 끝에. 윗줄은 뒤집는다.
  function foldSheets(){
    var order = [];
    for (var i = 1; i < srcUrls.length; i++) order.push(i);
    // 표지는 반드시 오른쪽 아래 칸(4번째)에 와야 접었을 때 겉장이 된다.
    // 펼침면이 모자란 책은 그 앞자리를 비워 둔다.
    while (order.length % 4 !== 3) order.push(null);
    order.push(0);
    var pages = srcUrls.length * 2;                  // 앞표지·속지·뒤표지를 합친 쪽 수
    var out = [];
    for (var k = 0; k < order.length; k += 4) {
      var g = order.slice(k, k + 4);
      var f = function(n){ return (g[n] === undefined || g[n] === null) ? null : { file:g[n] }; };
      var top = function(n){ var x = f(n); if (x) x.rot = 180; return x; };
      var part = (order.length > 4) ? " (" + (k / 4 + 1) + ")" : "";
      if (paper === "a4x2") {
        // A3 한 장을 세로로 반 잘라 A4 세로 두 장에 나눈다(붙이면 A3 한 장).
        out.push(makeSheet(210, 297, 1, [top(0), f(2)], "왼쪽 장 · A4 세로" + part));
        out.push(makeSheet(210, 297, 1, [top(1), f(3)], "오른쪽 장 · A4 세로" + part));
      } else {
        var W = (paper === "a3") ? 420 : 297, H = (paper === "a3") ? 297 : 210;
        out.push(makeSheet(W, H, 2, [top(0), top(1), f(2), f(3)],
                 (paper === "a3" ? "A3 가로 한 장" : "A4 가로 한 장") + " · 접어서 " + pages + "쪽" + part));
      }
    }
    return out;
  }

  /// 전시용 A2 — 접지 않고 벽에 붙이는 배치(읽는 순서대로 쭉).
  ///   위:  [앞표지][1쪽][2쪽][3쪽] / 아래: [4쪽][5쪽][6쪽][뒤표지]
  function exhibitSheet(){
    var items = [{ file:0, half:"r" }];
    for (var i = 1; i < srcUrls.length; i++) {
      items.push({ file:i, half:"l" }); items.push({ file:i, half:"r" });
    }
    items.push({ file:0, half:"l" });
    while (items.length % 8) items.push(null);
    var out = [];
    for (var k = 0; k < items.length; k += 8)
      out.push(makeSheet(594, 420, 4, items.slice(k, k + 8), "전시용 A2 가로 한 장"));
    return out;
  }

  function layout(){ return (paper === "a2") ? exhibitSheet() : foldSheets(); }

  /// 칸 하나에 그림을 앉힌다.
  ///   full : 그림 한 장을 통째로 얹었을 때의 자리(테두리 바깥까지 포함)
  ///   clip : 그중 실제로 보이는 네모(테두리·반대쪽 반쪽은 여기서 가려진다)
  ///   뒤집힌 칸이면 좌표까지 뒤집어 종이 기준으로 돌려준다.
  function placeCell(cell){
    var m = meta[cell.file], crop = cell.crop, b = cell.box;
    if (fitMode === "extend") {
      // 칸에 딱 맞게 새로 그린 그림 — 잘리지도, 남지도 않는다.
      var ex = extendCell(cell);
      if (ex) return { file:cell.file, ext:ex, key:"x" + ex.w + "_" + ex.h + "_" + ex.url.length + "_" + cell.file + (cell.half || ""),
                       rot:cell.rot, mmPerPx:b.w / ex.w,
                       full:{ x:b.x, y:b.y, w:b.w, h:b.h },
                       clip:{ x:b.x, y:b.y, w:b.w, h:b.h } };
    }
    var s = (fitMode === "fill") ? Math.max(b.w / crop.w, b.h / crop.h)
                                 : Math.min(b.w / crop.w, b.h / crop.h);
    var dw = crop.w * s, dh = crop.h * s;
    var lx = (b.w - dw) / 2, ly = (b.h - dh) / 2;
    var full = { x:lx - crop.x * s, y:ly - crop.y * s, w:m.w * s, h:m.h * s };
    var cx = Math.max(0, lx), cy = Math.max(0, ly);
    var clip = { x:cx, y:cy,
                 w:Math.max(0, Math.min(lx + dw, b.w) - cx),
                 h:Math.max(0, Math.min(ly + dh, b.h) - cy) };
    function toSheet(r){
      return (cell.rot === 180)
        ? { x:b.x + b.w - r.x - r.w, y:b.y + b.h - r.y - r.h, w:r.w, h:r.h }
        : { x:b.x + r.x, y:b.y + r.y, w:r.w, h:r.h };
    }
    return { file:cell.file, key:"f" + cell.file, rot:cell.rot, mmPerPx:s,
             full:toSheet(full), clip:toSheet(clip) };
  }

  // ── 화면 미리보기 ──────────────────────────────────────────────────────
  var sheets = [];
  function render(){
    sheets = layout().map(function(sh){
      sh.placed = sh.cells.map(placeCell);
      return sh;
    });
    var host = el("sheets"); host.innerHTML = "";
    sheets.forEach(function(sh){
      var slot = document.createElement("div"); slot.className = "slot";
      var page = document.createElement("div"); page.className = "page";
      page.style.width = sh.w + "mm"; page.style.height = sh.h + "mm";
      sh.placed.forEach(function(p){
        var clip = document.createElement("div"); clip.className = "clip";
        clip.style.left = p.clip.x + "mm"; clip.style.top = p.clip.y + "mm";
        clip.style.width = p.clip.w + "mm"; clip.style.height = p.clip.h + "mm";
        var im = document.createElement("img");
        im.src = p.ext ? p.ext.url : srcUrls[p.file]; im.alt = "";
        if (p.rot === 180) im.className = "flip";
        im.style.left = (p.full.x - p.clip.x) + "mm"; im.style.top = (p.full.y - p.clip.y) + "mm";
        im.style.width = p.full.w + "mm"; im.style.height = p.full.h + "mm";
        clip.appendChild(im); page.appendChild(clip);
      });
      if (guidesOn) {
        sh.guides.v.forEach(function(x){
          var g = document.createElement("div"); g.className = "guide v";
          g.style.left = x + "mm"; page.appendChild(g);
        });
        sh.guides.h.forEach(function(y){
          var g = document.createElement("div"); g.className = "guide h";
          g.style.top = y + "mm"; page.appendChild(g);
        });
      }
      slot.appendChild(page);
      var cap = document.createElement("div"); cap.className = "cap";
      cap.textContent = sh.label + " · " + Math.round(sh.w) + "×" + Math.round(sh.h) + "mm";
      slot.appendChild(cap);
      host.appendChild(slot);
    });
    var first = sheets[0] || { w:420, h:297 };
    // 종이 크기 + '한 장에 들여 앉히기' 규칙. 아래 <style> 보다 규칙이 세도록
    // #sheets 를 앞에 붙인다(그냥 .slot 이면 아래 인쇄 규칙에 덮인다).
    var ins = PRINT_INSET[(first.w >= first.h) ? "land" : "port"];
    el("pageCss").textContent =
      "@page { size:" + first.w + "mm " + first.h + "mm; margin:0; }\n"
      + "@media print {\n"
      + "  #sheets .slot { height:" + num(first.h * (ins.t + ins.s)) + "mm !important; overflow:hidden; }\n"
      + "  #sheets .page { transform:translateY(" + num(first.h * ins.t) + "mm) scale(" + ins.s + ") !important;"
      + " transform-origin:top center; }\n"
      + "}";
    el("msg").hidden = true; el("bar").hidden = false;
    el("bookcard").hidden = false; el("sheetsTitle").hidden = false; el("sheets").hidden = false;
    fitSoon();
    showDpi();
  }

  /// 인쇄 크기(mm)는 그대로 두고 화면에서만 줄여 보여준다.
  ///   휴대폰은 종이가 화면 밖으로 넘치면 화면 너비를 크게 잡아 두었다가
  ///   줄인 뒤에야 제 너비를 알려 준다. 그래서 한 번 더 재서 맞춘다(fitSoon).
  function fitToScreen(){
    var availW = Math.max(200, (document.documentElement.clientWidth || window.innerWidth) - 28);
    var availH = Math.max(200, window.innerHeight - (el("bar").offsetHeight || 60) - 90);
    var slots = document.querySelectorAll("#sheets .slot");
    for (var i = 0; i < slots.length; i++) {
      var page = slots[i].querySelector(".page");
      var w = page.offsetWidth || 1, h = page.offsetHeight || 1;
      var s = Math.min(1, availW / w, availH / h);
      page.style.transform = "scale(" + s + ")";
      slots[i].style.width = Math.round(w * s) + "px";
      slots[i].style.height = Math.round(h * s) + "px";
    }
  }
  function fitSoon(){
    fitToScreen();
    requestAnimationFrame(fitToScreen);
    setTimeout(fitToScreen, 250);
    setTimeout(fitToScreen, 800);
  }
  window.addEventListener("resize", fitToScreen);

  /// 인쇄 해상도 — 가장 낮은 칸을 기준으로 알려 준다(200dpi면 인쇄소도 넉넉하다).
  function showDpi(){
    var worst = 0;
    sheets.forEach(function(sh){
      sh.placed.forEach(function(p){
        var dpi = 25.4 / p.mmPerPx;                 // 원본 1px 이 p.mmPerPx mm 로 커진다
        if (!worst || dpi < worst) worst = dpi;
      });
    });
    worst = Math.round(worst);
    el("dpi").textContent = worst ? ("인쇄 해상도 약 " + worst + " dpi"
      + (worst < 150 ? " · 조금 거칠 수 있어요" : (worst >= 200 ? " · 인쇄소에 맡겨도 좋아요" : ""))) : "";
  }

  // ── PDF 파일 만들기 ────────────────────────────────────────────────────
  //   원본 JPEG 를 다시 그리지 않고 그대로 넣는다(화질이 하나도 안 깎인다).
  //   테두리 자르기·반쪽 나누기·뒤집기는 PDF 안에서 자리와 오려 보일 곳으로 처리한다.
  function latin1(s){
    var a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255;
    return a;
  }
  function pdfText(s){                            // 한글 제목은 UTF-16 로 적는다
    var out = "FEFF";
    for (var i = 0; i < s.length; i++) out += ("000" + s.charCodeAt(i).toString(16)).slice(-4);
    return "<" + out.toUpperCase() + ">";
  }
  function pad10(n){ return ("0000000000" + n).slice(-10); }
  function num(v){ return (Math.round(v * 1000) / 1000).toString(); }

  function PDF(){ this.objs = []; }
  PDF.prototype.add = function(body, stream){ this.objs.push({ body:body, stream:stream || null }); return this.objs.length; };
  PDF.prototype.blob = function(rootId, infoId){
    var parts = [], len = 0, i;
    function put(x){ var u = (typeof x === "string") ? latin1(x) : x; parts.push(u); len += u.length; }
    put("%PDF-1.4\n%âãÏÓ\n");
    var offs = [];
    for (i = 0; i < this.objs.length; i++) {
      offs[i] = len;
      var o = this.objs[i];
      put((i + 1) + " 0 obj\n" + o.body + "\n");
      if (o.stream) { put("stream\n"); put(o.stream); put("\nendstream\n"); }
      put("endobj\n");
    }
    var xref = len, n = this.objs.length + 1;
    var s = "xref\n0 " + n + "\n0000000000 65535 f \n";
    for (i = 0; i < offs.length; i++) s += pad10(offs[i]) + " 00000 n \n";
    s += "trailer\n<< /Size " + n + " /Root " + rootId + " 0 R /Info " + infoId + " 0 R >>\n"
       + "startxref\n" + xref + "\n%%EOF\n";
    put(s);
    return new Blob(parts, { type:"application/pdf" });
  };

  /// JPEG 파일에서 크기와 색 종류를 읽는다. PDF 에 그대로 넣어도 되는지도 함께 본다.
  function jpegInfo(b){
    if (b.length < 4 || b[0] !== 0xFF || b[1] !== 0xD8) return null;
    var i = 2;
    while (i + 3 < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      var m = b[i + 1];
      if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
      if (m === 0xD9 || m === 0xDA) break;
      var len = (b[i + 2] << 8) | b[i + 3];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
        return { w:(b[i + 7] << 8) | b[i + 8], h:(b[i + 5] << 8) | b[i + 6],
                 nc:b[i + 9], prec:b[i + 4],
                 plain:(m === 0xC0 || m === 0xC1) };   // 이 두 가지만 PDF 가 확실히 읽는다
      }
      i += 2 + len;
    }
    return null;
  }

  /// 원본 파일을 그대로 쓸 수 없을 때만 한 번 다시 그려 JPEG 로 만든다.
  function reencode(i){
    return new Promise(function(res, rej){
      var img = imgs[i];
      if (!img || !img.naturalWidth) { rej(new Error("그림을 불러오지 못했어요")); return; }
      var cv = document.createElement("canvas");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext("2d").drawImage(img, 0, 0);
      try {
        cv.toBlob(function(blob){
          if (!blob) { rej(new Error("그림을 만들지 못했어요")); return; }
          blob.arrayBuffer().then(function(buf){
            var b = new Uint8Array(buf), info = jpegInfo(b);
            if (!info) { rej(new Error("그림을 만들지 못했어요")); return; }
            res({ bytes:b, w:info.w, h:info.h, nc:info.nc });
          }).catch(rej);
        }, "image/jpeg", 0.95);
      } catch (e) { rej(new Error("이 그림은 브라우저가 내려받기를 막고 있어요")); }
    });
  }

  /// 새로 그린 그림(data:URL)을 PDF 에 넣을 바이트로 바꾼다.
  function dataUrlBytes(u){
    var bin = atob(u.split(",")[1]);
    var a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  var embedCache = {};
  function embedOf(i){
    if (embedCache[i]) return Promise.resolve(embedCache[i]);
    return fetch(srcUrls[i])
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(buf){
        var b = new Uint8Array(buf), info = jpegInfo(b);
        if (info && info.plain && info.prec === 8 && (info.nc === 1 || info.nc === 3)) {
          return { bytes:b, w:info.w, h:info.h, nc:info.nc };     // 원본 그대로 — 화질 그대로
        }
        return reencode(i);
      })
      .catch(function(){ return reencode(i); })
      .then(function(e){ embedCache[i] = e; return e; });
  }

  var PT = 72 / 25.4;                               // mm → PDF 단위(pt)

  function makePdf(){
    // 쪽마다 쓰는 그림을 모은다 — 원본 파일(f0…)과 새로 그린 칸 그림(x…)이 섞인다.
    var used = {};
    sheets.forEach(function(sh){ sh.placed.forEach(function(p){ used[p.key] = p; }); });
    var keys = Object.keys(used);
    return Promise.all(keys.map(function(k){
      var p = used[k];
      if (p.ext) {                                   // 새로 그린 칸 그림 — 이미 JPEG 다
        var by = dataUrlBytes(p.ext.url), info = jpegInfo(by);
        return { bytes:by, w:info ? info.w : p.ext.w, h:info ? info.h : p.ext.h, nc:info ? info.nc : 3 };
      }
      return embedOf(p.file);                        // 원본 파일 그대로(화질이 안 깎인다)
    })).then(function(list){
      var byFile = {};
      keys.forEach(function(k, i){ byFile[k] = list[i]; });

      var pdf = new PDF();
      var rootId = pdf.add("");                                  // 1 목차(나중에 채운다)
      var pagesId = pdf.add("");                                 // 2 쪽 목록(나중에 채운다)
      var infoId = pdf.add("<< /Title " + pdfText(bookName + " (그림책 인쇄용)")
                         + " /Producer (Artable artclasshub-gallery) >>");
      var imgId = {};
      keys.forEach(function(f){
        var e = byFile[f];
        imgId[f] = pdf.add("<< /Type /XObject /Subtype /Image /Width " + e.w + " /Height " + e.h
                         + " /ColorSpace /Device" + (e.nc === 1 ? "Gray" : "RGB")
                         + " /BitsPerComponent 8 /Filter /DCTDecode /Length " + e.bytes.length + " >>", e.bytes);
      });

      var kids = [];
      sheets.forEach(function(sh){
        var pw = sh.w * PT, ph = sh.h * PT;
        var content = "", xo = [];
        sh.placed.forEach(function(p, k){
          var nm = "Im" + k;
          xo.push("/" + nm + " " + imgId[p.key] + " 0 R");
          var cx = p.clip.x * PT, cy = ph - (p.clip.y + p.clip.h) * PT;   // PDF 는 아래에서 위로 잰다
          var fx = p.full.x * PT, fy = ph - (p.full.y + p.full.h) * PT;
          var fw = p.full.w * PT, fh = p.full.h * PT;
          // 뒤집힌 칸은 그림을 180° 돌려 앉힌다(크기를 음수로 주고 반대쪽 모서리에서 시작).
          var cm = (p.rot === 180)
            ? (num(-fw) + " 0 0 " + num(-fh) + " " + num(fx + fw) + " " + num(fy + fh))
            : (num(fw) + " 0 0 " + num(fh) + " " + num(fx) + " " + num(fy));
          content += "q\n"
            + num(cx) + " " + num(cy) + " " + num(p.clip.w * PT) + " " + num(p.clip.h * PT) + " re W n\n"
            + cm + " cm\n/" + nm + " Do\nQ\n";
        });
        if (guidesOn) {
          // 접는 선은 접을 자리만 알아보면 된다. 종이에 진하게 남지 않도록
          // 가늘게(0.3pt ≈ 0.1mm) · 연하게(먹 25%) · 잔점선으로 긋는다.
          content += "q\n" + GUIDE.gray + " G " + GUIDE.w + " w [" + GUIDE.dash + "] 0 d\n";
          sh.guides.v.forEach(function(x){
            content += num(x * PT) + " 0 m " + num(x * PT) + " " + num(ph) + " l S\n";
          });
          sh.guides.h.forEach(function(y){
            content += "0 " + num(ph - y * PT) + " m " + num(pw) + " " + num(ph - y * PT) + " l S\n";
          });
          content += "Q\n";
        }
        var cid = pdf.add("<< /Length " + content.length + " >>", latin1(content));
        kids.push(pdf.add("<< /Type /Page /Parent " + pagesId + " 0 R /MediaBox [0 0 "
          + num(pw) + " " + num(ph) + "] /Resources << /XObject << " + xo.join(" ")
          + " >> >> /Contents " + cid + " 0 R >>"));
      });

      pdf.objs[rootId - 1].body = "<< /Type /Catalog /Pages " + pagesId + " 0 R >>";
      pdf.objs[pagesId - 1].body = "<< /Type /Pages /Count " + kids.length + " /Kids ["
        + kids.map(function(k){ return k + " 0 R"; }).join(" ") + "] >>";
      return pdf.blob(rootId, infoId);
    });
  }

  function busy(btn, on, label){
    btn.disabled = on;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
    else if (btn.dataset.label) { btn.textContent = btn.dataset.label; }
  }

  var PAPER_NAME = { a3:"A3 원본", a4:"A4 축소", a4x2:"A4 2장", a2:"A2 전시용" };

  function pdfName(){ return bookName + " (인쇄용 " + PAPER_NAME[paper] + ").pdf"; }
  function savePdf(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = pdfName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
  }

  el("pdfBtn").addEventListener("click", function(){
    var btn = this;
    busy(btn, true, "⏳ 만드는 중…");
    makePdf()
      .then(savePdf)
      .catch(function(err){
        alert("PDF 를 만들지 못했어요: " + ((err && err.message) || err)
            + "\n대신 ‘🖨 프린트’를 눌러 인쇄 창에서 ‘PDF로 저장’을 골라 주세요.");
      })
      .then(function(){ busy(btn, false); });
  });

  // ── 프린트 — 화면(HTML)이 아니라 PDF 를 인쇄한다 ───────────────────────
  //   ① 브라우저가 종이에 찍어 넣는 주소·날짜(머리말·꼬리말)가 안 나온다.
  //      아이폰 사파리는 그 줄을 끄는 설정이 아예 없어서, 웹페이지로 인쇄하면
  //      아래에 주소가 그대로 남는다(PC 크롬은 기본으로 꺼져 있어 안 남았다).
  //   ② 판 크기가 종이와 똑같은 PDF 라, 프린터의 '여백 없음(무테)' 을 켜면
  //      종이 끝까지 꽉 찬다. 브라우저가 다시 배치하지 않으니 두 장으로도 안 갈라진다.
  function isMobile(){
    return /iPad|iPhone|iPod|Android/i.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  var printFrame = null;

  el("printBtn").addEventListener("click", function(){
    var btn = this;
    busy(btn, true, "⏳ 만드는 중…");
    makePdf()
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        if (isMobile()) {
          // 휴대폰은 숨은 창으로 인쇄를 못 시킨다. PDF 를 열어 주고 공유 → 프린트로 안내.
          var w = window.open(url, "_blank");
          if (!w) savePdf(blob);                      // 새 창이 막히면 파일로 받아 준다
          setTimeout(function(){
            alert((w ? "PDF 를 열었어요. " : "PDF 를 받았어요. 파일 앱에서 열고 ")
                + "공유 아이콘(⬆︎) → ‘프린트’ 를 눌러 주세요.\n"
                + "프린터 설정에서 ‘여백 없음(무테)’ 을 켜면 종이 끝까지 찍혀요.");
          }, 400);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
          return;
        }
        // PC — 안 보이는 창에 PDF 를 넣고 그대로 인쇄 창을 연다.
        if (printFrame && printFrame.parentNode) printFrame.parentNode.removeChild(printFrame);
        printFrame = document.createElement("iframe");
        printFrame.setAttribute("aria-hidden", "true");
        printFrame.style.cssText = "position:fixed; right:0; bottom:0; width:1px; height:1px; opacity:0; border:0;";
        printFrame.onload = function(){
          try { printFrame.contentWindow.focus(); printFrame.contentWindow.print(); }
          catch (e) { window.open(url, "_blank"); }
          setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
        };
        printFrame.src = url;
        document.body.appendChild(printFrame);
      })
      .catch(function(err){
        // PDF 를 못 만들면 예전처럼 화면을 인쇄한다(주소 줄이 남을 수 있다).
        alert("PDF 로 인쇄하지 못해 화면 그대로 인쇄합니다.\n(" + ((err && err.message) || err) + ")");
        window.print();
      })
      .then(function(){ busy(btn, false); });
  });

  // ── 도구 모음 ──────────────────────────────────────────────────────────
  var NOTE = {
    a3:  "A3 가로로 한 장 뽑아 가로·세로 반씩 접으면 그림책이 돼요 · 배율 100%",
    a4:  "A4 가로로 한 장 뽑아 가로·세로 반씩 접으면 손바닥만 한 그림책이 돼요 · 배율 100%",
    a4x2:"A4 세로로 두 장 뽑아 옆으로 붙이면 A3 한 장이 돼요 · 배율 100%",
    a2:  "접지 않고 벽에 붙이는 전시용이에요 · 인쇄 창에서 A2 가로, 배율 100%"
  };
  function syncBar(){
    var segs = el("paperSeg").querySelectorAll("button");
    for (var i = 0; i < segs.length; i++)
      segs[i].classList.toggle("on", segs[i].getAttribute("data-p") === paper);
    el("fitBtn").textContent = "그림: " + (fitMode === "extend" ? "자동 채움"
                                        : fitMode === "whole" ? "안 잘리게(흰 여백)"
                                                              : "종이 꽉(가장자리 잘림)");
    el("trimBtn").textContent = "테두리: " + (trimOn ? "정리" : "그대로");
    el("trimBtn").disabled = !pixelsReadable;
    el("guideBtn").textContent = "접는 선: " + (guidesOn ? "보임" : "숨김");
    el("note").textContent = NOTE[paper]
      + " · ‘프린트’는 PDF 로 인쇄합니다(주소·날짜 안 찍힘, 프린터의 ‘여백 없음’ 을 켜면 꽉 참)";
  }
  el("paperSeg").addEventListener("click", function(e){
    var p = e.target && e.target.getAttribute && e.target.getAttribute("data-p");
    if (!p || p === paper) return;
    paper = p; prefSet("printPaper2", paper); syncBar(); render();
  });
  el("fitBtn").addEventListener("click", function(){
    fitMode = FITS[(FITS.indexOf(fitMode) + 1) % FITS.length];
    // 픽셀을 못 읽는 그림은 자동 채움을 만들 수 없다 — 건너뛴다.
    if (fitMode === "extend" && !pixelsReadable) fitMode = "whole";
    prefSet("printFit2", fitMode); syncBar(); render();
  });
  el("trimBtn").addEventListener("click", function(){
    trimOn = !trimOn; prefSet("printTrim", trimOn ? "1" : "0"); syncBar(); render();
  });
  el("guideBtn").addEventListener("click", function(){
    guidesOn = !guidesOn; prefSet("printGuide", guidesOn ? "1" : "0"); syncBar(); render();
  });

  el("backBtn").href = "viewer.html?book=" + encodeURIComponent(bookId || "")
                     + (classId ? "&class=" + encodeURIComponent(classId) : "");
  el("listBtn").href = classId ? "./?class=" + encodeURIComponent(classId) : "./";

  // ── 책 이름 — 반 목록에서 이 책의 제목과 지은이를 찾아 쓴다 ────────────
  //   파일 이름에도 쓰인다. 그냥 두면 모든 책이 같은 이름으로 저장돼 서로 덮어쓴다.
  function setBookName(){
    if (!bookId || !classId) return Promise.resolve();
    return fetch(API + "?class=" + encodeURIComponent(classId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok || !d.books) return;
        var me = null;
        for (var i = 0; i < d.books.length; i++) if (d.books[i].bookId === bookId) { me = d.books[i]; break; }
        if (!me) return;
        var name = String(me.student || "").trim();
        var t = String(me.title || "").replace(/\s+/g, " ").trim();
        var cls = String(me.className || d.className || d.class || "").trim();
        el("bookTitle").textContent = t || "그림책";
        el("bookWho").textContent = [name, cls].filter(Boolean).join(" · ") || "우리 반 그림책";
        var base = (name && t) ? (name + " - " + t) : (name || t);
        base = base.replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
        if (base) { bookName = base; document.title = base + " (그림책 인쇄용)"; }
      })
      .catch(function(){ /* 못 읽으면 기본 이름 그대로 */ });
  }

  if (!bookId) { el("msg").textContent = "주소에 book 이 없어요."; }
  else {
    setBookName();
    fetch(API + "?book=" + encodeURIComponent(bookId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok || !d.pages || !d.pages.length) { el("msg").textContent = "그림책을 찾지 못했어요 😢"; return; }
        srcUrls = d.pages;
        return Promise.all(srcUrls.map(loadImage)).then(function(list){
          if (list.some(function(im){ return !im || !im.naturalWidth; })) {
            el("msg").textContent = "그림을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."; return;
          }
          imgs = list;
          meta = list.map(measure);
          if (!pixelsReadable) { trimOn = false; if (fitMode === "extend") fitMode = "whole"; }
          syncBar();
          render();
        });
      })
      .catch(function(){ el("msg").textContent = "불러오지 못했어요. 잠시 뒤 다시 열어 주세요."; });
  }
</script>
</body>
