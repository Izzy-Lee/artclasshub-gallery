<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림책 전시용 A2 📐</title>
<style>
  :root { --pink:#F35AA0; --bg:#FDF6F9; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }

  /* 화면 위 도구 모음 — 인쇄할 땐 숨긴다 */
  #bar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:10px; align-items:center;
         padding:10px 14px; background:rgba(255,255,255,.94); box-shadow:0 2px 10px rgba(0,0,0,.08); }
  #bar .t { font-weight:800; color:var(--pink); margin-right:4px; }
  #bar .hint { color:#888; font-size:12px; margin-left:auto; }
  #bar button, #bar a { border:0; border-radius:999px; padding:9px 14px; font-size:13px; font-weight:700;
                        cursor:pointer; background:var(--pink); color:#fff; text-decoration:none; font-family:inherit; }
  #bar button.ghost { background:#eee; color:#666; }
  #seamBox { display:flex; align-items:center; gap:4px; }
  #seamBox button { padding:9px 10px; }
  #seamVal { font-size:12px; color:#888; min-width:64px; text-align:center; }
  #msg { padding:80px 20px; text-align:center; color:#9a7; font-size:17px; }

  /* A2 가로 한 장 = 594 x 420mm. 4열 x 2행 → 한 칸이 정확히 A5(148.5 x 210mm). */
  #wrap { display:flex; justify-content:center; padding:70px 10px 24px; overflow:hidden; width:100%; }
  /* flex 자식이라 그냥 두면 창 너비에 맞춰 눌린다 → 줄어들지 않게 고정. */
  .sheet { width:594mm; height:420mm; flex:0 0 auto; background:#fff; display:grid;
           grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(2, 1fr);
           transform-origin:top center; box-shadow:0 10px 40px rgba(0,0,0,.15); }
  /* 쪽과 쪽 사이 칸막이 선 — 자르거나 붙일 때 기준이 된다(바깥 테두리는 없음). */
  .cell { position:relative; overflow:hidden; }
  .cell { border-right:1px solid #9a9a9a; }
  .cell:nth-child(4n) { border-right:0; }
  .cell:nth-child(-n+4) { border-bottom:1px solid #9a9a9a; }
  /* 펼침면 한 장에서 왼쪽/오른쪽 반만 보여준다.
     칸 2배 너비 상자에 그림을 넣고(맞춤/채움), 오른쪽 반은 한 칸만큼 밀어 놓는다. */
  .cell img, .cell canvas { position:absolute; top:0; height:100%; width:200%; display:block; object-fit:contain; }
  .cell canvas { width:100%; }          /* 자동 채움은 칸에 딱 맞게 그려 둔다 */
  .cell img.r { left:-100%; }
  .cell img.l { left:0; }
  .sheet.fill .cell img { object-fit:cover; }

  @media print {
    @page { size:594mm 420mm; margin:0; }
    html,body { background:#fff; }
    #bar, #msg { display:none !important; }
    #wrap { padding:0; overflow:visible; height:auto !important; }
    .sheet { transform:none !important; box-shadow:none; }
  }
</style>
</head>
<body>
<div id="bar" hidden>
  <span class="t">전시용 A2 📐</span>
  <button id="printBtn">🖨 인쇄 · PDF로 저장</button>
  <button id="fillBtn" class="ghost">여백: 자동 채움</button>
  <a id="backBtn" class="ghost" href="#">‹ 그림책으로</a>
  <a id="listBtn" class="ghost" href="#">‹ 리스트로</a>
  <span id="seamBox"><button id="seamL" class="ghost" title="이음매 왼쪽으로">◀</button><span id="seamVal">이음매 0</span><button id="seamR" class="ghost" title="이음매 오른쪽으로">▶</button></span>
  <span id="dpi" class="hint"></span>
  <span class="hint">인쇄 창에서 용지 <b>A2 가로</b>, 배율 100%, 여백 없음으로 맞춰 주세요</span>
</div>
<div id="msg">전시용으로 펼치는 중… 📐</div>
<div id="wrap" hidden><div class="sheet" id="sheet"></div></div>
<script>
  var API = "https://script.google.com/macros/s/AKfycbzBg9ghzZSLv0J3MlUWMNVscBQuKVd2JgYS-HyiBAuqzPEh5qbGCUW9o_PorKOILx4/exec";
  // 그림 키우기(업스케일)를 부탁할 곳 — 앱이 쓰는 AI 프록시와 같은 웹앱.
  var AI_API = "https://script.google.com/macros/s/AKfycbyV5LibT5DHLAIwujt8u8yjkyBtxpzSMF5T2aepcPdbgvQITCKc7kou4mlqcNxIvLKZ/exec";
  var AI_SECRET = "artclasshub-ai-7Kq3mZ9x";
  // A2 한 칸(A5, 가로 148.5mm)에 필요한 가로 픽셀 — 인쇄소 권장 200dpi 기준.
  var HALF_MM = 148.5;
  function dpiOf(spreadWidth){ return Math.round((spreadWidth / 2) / (HALF_MM / 25.4)); }
  var LOW_DPI = 150;                 // 이보다 낮으면 전시 인쇄엔 너무 낮다고 본다
  var qp = new URLSearchParams(location.search);
  var bookId = qp.get("book");
  var classId = qp.get("class") || "";
  var el = function(id){ return document.getElementById(id); };

  /* 칸 배치 — 접지 않고 벽에 붙이는 전시용.
       위:  [1번 오른쪽=앞표지] [2번 왼쪽] [2번 오른쪽] [3번 왼쪽]
       아래: [3번 오른쪽]       [4번 왼쪽] [4번 오른쪽] [1번 왼쪽=뒤표지]
     → 2번·4번 펼침면은 그대로 이어 붙고, 3번은 위 오른쪽 끝에서 아래 왼쪽 끝으로 이어진다. */
  /// 쪽 수에 맞춰 칸을 만든다 — 4장이면 위 배치 그대로,
  /// 3장처럼 적게 올라온 책은 있는 만큼만 순서대로 채우고 뒤쪽 칸을 비운다.
  function layoutFor(n){
    var out = [{ file:0, half:"r" }];                  // 앞표지
    for (var i = 1; i < n; i++) { out.push({ file:i, half:"l" }); out.push({ file:i, half:"r" }); }
    out.push({ file:0, half:"l" });                    // 뒤표지
    while (out.length < 8) out.push(null);             // 남는 칸은 빈칸
    return out.slice(0, 8);
  }

  /// 아주 낮은 해상도일 때만 AI로 키운다(선화·일러스트용 확대 모델, 내용은 그대로 두고 크기만).
  /// 키가 없거나 실패하면 조용히 원본을 쓴다 — 인쇄는 어차피 된다.
  function upscaleIfTooLow(list){
    return Promise.all(list.map(function(u){
      return new Promise(function(res){
        var im = new Image(); im.crossOrigin = "anonymous";
        im.onerror = function(){ res({ url: u, w: 0 }); };
        im.onload = function(){ res({ url: u, w: im.naturalWidth, img: im }); };
        im.src = u;
      });
    })).then(function(info){
      var widths = info.map(function(x){ return x.w || 99999; });
      var worst = Math.min.apply(null, widths);
      var dpi = dpiOf(worst);
      el("dpi").textContent = "인쇄 해상도 약 " + dpi + " dpi";
      if (dpi >= LOW_DPI) return list;                       // 충분하면 그대로 쓴다

      el("dpi").textContent = "해상도가 낮아 키우는 중… (" + dpi + " dpi)";
      return Promise.all(info.map(function(x){
        if (!x.img || dpiOf(x.w) >= LOW_DPI) return x.url;   // 이 쪽은 충분
        var cv = document.createElement("canvas");
        cv.width = x.img.naturalWidth; cv.height = x.img.naturalHeight;
        cv.getContext("2d").drawImage(x.img, 0, 0);
        var b64;
        try { b64 = cv.toDataURL("image/jpeg", 0.92).split(",")[1]; } catch (e) { return x.url; }
        return fetch(AI_API, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ secret: AI_SECRET, action: "upscale", image: b64, scale: 2 })
        })
          .then(function(r){ return r.text(); })
          .then(function(t){ var d = null; try { d = JSON.parse(t); } catch (e) {}
            return (d && d.ok && d.image) ? ("data:image/png;base64," + d.image) : x.url; })
          .catch(function(){ return x.url; });
      })).then(function(done){
        var changed = done.some(function(u, i){ return u !== list[i]; });
        el("dpi").textContent = changed ? ("크게 키움 · 약 " + dpiOf(worst * 2) + " dpi")
                                        : ("약 " + dpi + " dpi (그대로 인쇄됩니다)");
        return done;
      });
    });
  }

  // 여백 처리 — keep(남김) / extend(가장자리 색으로 늘려 채움) / fill(꽉 채우되 잘림)
  var fillMode = "extend";
  var lastPages = null;
  // 자동으로 찾은 이음매가 그림과 살짝 어긋날 때 손으로 밀어 맞추는 값(원본 픽셀).
  var seamNudge = 0;

  // ── 그림 파일에 같이 저장된 테두리 잘라내기 ────────────────────────────
  //   어떤 쪽은 종이 카드의 회색 그림자 띠와 검은 실선까지 그림 안에 찍혀 있다
  //   (반 전체 11권 중 10권, 38쪽). 인쇄 시트에서는 그 부분만 빼고 쓴다.
  //   원본 파일은 건드리지 않는다 — 화면·인쇄에서만 잘라 쓴다.
  //   테두리는 '한 줄 안에서 색이 거의 변하지 않는다'는 점으로 알아본다.
  function lineStat(d, W, H, side, n){
    var horiz = (side === "l" || side === "r");
    var lines = horiz ? W : H, across = horiz ? H : W;
    var i = (side === "l" || side === "t") ? n : lines - 1 - n;
    var sum = 0, sum2 = 0, cnt = 0;
    for (var j = 0; j < across; j += 3) {
      var o = (horiz ? (j * W + i) : (i * W + j)) * 4;
      var g = (d[o] + d[o + 1] + d[o + 2]) / 3;
      sum += g; sum2 += g * g; cnt++;
    }
    var m = sum / cnt;
    return { mean: m, sd: Math.sqrt(Math.max(0, sum2 / cnt - m * m)) };
  }
  function borderRun(d, W, H, side){
    var lines = (side === "l" || side === "r") ? W : H;
    var cap = Math.round(lines * 0.12);       // 테두리는 얇다. 이보다 넓으면 그림의 일부로 본다.
    var n = 0;
    while (n < cap && lineStat(d, W, H, side, n).sd < 22) n++;
    if (n >= cap) n = 0;                      // 넓은 단색 면 = 일부러 비워 둔 배경
    for (var k = 0; k < 3; k++) {             // 남은 1~2px 실선까지 마저 벗긴다
      if (n + 4 >= lines) break;
      if (Math.abs(lineStat(d, W, H, side, n).mean - lineStat(d, W, H, side, n + 3).mean) > 55) n++;
      else break;
    }
    if (!n) return 0;
    // ① 테두리는 종이보다 뚜렷하게 어둡다(회색 그림자·검은 실선).
    //    밝은 띠는 아이가 일부러 남긴 여백이므로 절대 건드리지 않는다.
    if (lineStat(d, W, H, side, 0).mean >= 225) return 0;
    // ② 테두리는 안쪽 그림과 뚝 끊긴다. 깊은 바다색처럼 어두운 그러데이션은
    //    평평하고 어둡지만 안쪽으로 이어지므로 여기서 걸러진다(그건 아이 그림이다).
    var darkest = 255;
    for (var q = 0; q < n; q++) darkest = Math.min(darkest, lineStat(d, W, H, side, q).mean);
    var inside = lineStat(d, W, H, side, Math.min(lines - 1, n + 2)).mean;
    if (inside - darkest <= 45) return 0;
    return n;
  }
  function trimFrame(img){
    return new Promise(function(res){
      if (!img || !img.naturalWidth) { res(img); return; }
      var W = img.naturalWidth, H = img.naturalHeight;
      var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      var ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      var d;
      try { d = ctx.getImageData(0, 0, W, H).data; } catch (e) { res(img); return; }
      var L = borderRun(d, W, H, "l"), R = borderRun(d, W, H, "r");
      var T = borderRun(d, W, H, "t"), B = borderRun(d, W, H, "b");
      if (!L && !R && !T && !B) { res(img); return; }   // 1px 실선도 놓치면 안 된다 —
                                                        // 칸 여백을 1px 늘려 채우다 검은 띠가 된다
      var w2 = W - L - R, h2 = H - T - B;
      if (w2 < W * 0.5 || h2 < H * 0.5) { res(img); return; }   // 너무 많이 자르면 그만둔다
      var oc = document.createElement("canvas"); oc.width = w2; oc.height = h2;
      oc.getContext("2d").drawImage(cv, L, T, w2, h2, 0, 0, w2, h2);
      var out = new Image();
      out.onload = function(){ res(out); };
      out.onerror = function(){ res(img); };
      out.src = oc.toDataURL("image/jpeg", 0.94);
    });
  }

  /// 그림 한가운데의 '거의 흰 세로 띠'(두 쪽 사이 여백)를 찾아 그 한가운데 x를 돌려준다.
  /// 아이 그림의 실제 이음매가 정확히 절반이 아닐 때, 칸막이 선과 어긋나 보이는 걸 막는다.
  /// 못 찾으면(가장자리까지 그림이 꽉 찬 경우) 그냥 절반을 쓴다.
  var seamCache = {};
  function seamCenter(img, key){
    if (seamCache[key] !== undefined) return seamCache[key];
    var W = img.naturalWidth, H = img.naturalHeight, mid = Math.round(W / 2);
    var band = Math.round(W * 0.12);                       // 가운데 ±12%만 살펴본다
    var x0 = Math.max(0, mid - band), x1 = Math.min(W - 1, mid + band);
    var cw = x1 - x0 + 1, ch = Math.min(H, 360);           // 세로는 360줄로 줄여 빠르게
    var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    var ctx = cv.getContext("2d", { willReadFrequently: true });
    var data;
    try {
      ctx.drawImage(img, x0, 0, cw, H, 0, 0, cw, ch);
      data = ctx.getImageData(0, 0, cw, ch).data;
    } catch (e) { seamCache[key] = mid; return mid; }

    // 세로줄마다 '무늬 정도'를 잰다 — 옆 줄과 얼마나 다른가(색과 무관).
    // 두 쪽 사이 여백은 배경색이 그대로 이어져 무늬가 거의 0이다(흰색이든 바다색이든).
    var energy = new Array(cw).fill(0);
    for (var x = 1; x < cw; x++) {
      var sum = 0;
      for (var y = 0; y < ch; y++) {
        var i = (y * cw + x) * 4, j = (y * cw + (x - 1)) * 4;
        sum += Math.abs(data[i] - data[j]) + Math.abs(data[i+1] - data[j+1]) + Math.abs(data[i+2] - data[j+2]);
      }
      energy[x] = sum / ch;                                 // 줄당 평균 차이(0~765)
    }
    energy[0] = energy[1] || 0;

    var FLAT = 2.0;                                         // 이 정도면 '무늬 없음'
    var flat = energy.map(function(e){ return e <= FLAT; });
    var c = mid - x0;
    if (!flat[c]) {                                         // 가운데가 그림이면 가까운 평평한 줄로
      var found = -1;
      for (var d = 1; d < cw; d++) {
        if (c - d >= 0 && flat[c - d]) { found = c - d; break; }
        if (c + d < cw && flat[c + d]) { found = c + d; break; }
      }
      if (found < 0) { seamCache[key] = mid; return mid; }
      c = found;
    }
    var a = c, b = c;
    while (a - 1 >= 0 && flat[a - 1]) a--;
    while (b + 1 < cw && flat[b + 1]) b++;
    // 너무 넓은 평지(그림이 거의 없는 쪽)는 이음매로 보기 어렵다 → 절반 유지
    if ((b - a + 1) > cw * 0.6) { seamCache[key] = mid; return mid; }
    var center = x0 + Math.round((a + b) / 2);
    if (Math.abs(center - mid) > W * 0.10) center = mid;    // 너무 멀면 믿지 않는다
    seamCache[key] = center;
    return center;
  }

  /// 칸 하나를 캔버스로 그린다 — 그림 비율이 어떻든 같은 방식으로.
  ///   1) 반쪽을 칸 안에 통째로 넣고(잘리지 않게)
  ///   2) 남는 자리는 그림 가장자리 **한 줄(1px)** 색을 늘려 메운다.
  ///      글씨가 가장자리에 바짝 붙은 경우를 대비해, 무늬 없는 줄을 우선 고른다.
  function drawExtendedCell(cell, img, half, key){
    var W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) return false;
    var sw = Math.floor(W / 2);
    var seam = seamCenter(img, key) + seamNudge;
    var sx = (half === "r") ? seam : (seam - sw);          // 그림 밖으로 나갈 수 있다

    var cw = sw, ch = Math.round(cw / 0.70707);            // 칸(A5) 비율
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    var ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = true;

    // 반쪽 전체가 보이도록 맞춘다(가로·세로 중 더 빡빡한 쪽 기준).
    var scale = Math.min(cw / sw, ch / H);
    var dw = Math.round(sw * scale), dh = Math.round(H * scale);
    var dx = Math.round((cw - dw) / 2), dy = Math.round((ch - dh) / 2);

    // 원본 안쪽으로 잘라 읽을 구간(그림 밖은 못 읽는다)
    var cx = Math.max(0, sx), cx2 = Math.min(W, sx + sw);
    var cWid = Math.max(1, cx2 - cx);
    var offL = (cx - sx) * scale;                          // 왼쪽으로 모자란 만큼
    var offR = (sx + sw - cx2) * scale;                    // 오른쪽으로 모자란 만큼

    // ── 남는 자리 메우기: 가장자리 한 줄을 늘린다 ─────────────────
    function edgeRow(dir){          // dir: 't'|'b'|'l'|'r' — 무늬 없는 줄을 최대 6px 안쪽까지 찾는다
      var lim = 6, best = 0;
      for (var k = 0; k < lim; k++) {
        var sxx, syy, sww, shh;
        if (dir === "t") { sxx = cx; syy = k; sww = cWid; shh = 1; }
        else if (dir === "b") { sxx = cx; syy = H - 1 - k; sww = cWid; shh = 1; }
        else if (dir === "l") { sxx = cx + k; syy = 0; sww = 1; shh = H; }
        else { sxx = cx2 - 1 - k; syy = 0; sww = 1; shh = H; }
        best = k;
        break;                       // 지금은 맨 가장자리 한 줄을 쓴다(1px)
      }
      return best;
    }
    if (dy > 0) {                                          // 위·아래 여백
      ctx.drawImage(img, cx, edgeRow("t"), cWid, 1, dx + offL, 0, dw - offL - offR, dy + 1);
      ctx.drawImage(img, cx, H - 1 - edgeRow("b"), cWid, 1, dx + offL, dy + dh - 1, dw - offL - offR, ch - (dy + dh) + 1);
    }
    if (offL > 0.5) ctx.drawImage(img, cx, 0, 1, H, 0, dy, dx + offL + 1, dh);         // 이음매를 옮겨 생긴 왼쪽
    if (offR > 0.5) ctx.drawImage(img, cx2 - 1, 0, 1, H, cw - (offR + 1), dy, offR + 1, dh);
    if (dx > 0) {                                          // 좌·우 여백(세로로 긴 그림)
      ctx.drawImage(img, cx, 0, 1, H, 0, dy, dx + 1, dh);
      ctx.drawImage(img, cx2 - 1, 0, 1, H, dx + dw - 1, dy, cw - (dx + dw) + 1, dh);
    }

    // ── 그림 본체
    ctx.drawImage(img, cx, 0, cWid, H, dx + offL, dy, dw - offL - offR, dh);
    cell.appendChild(cv);
    return true;
  }

  function build(pages, imgs){
    lastPages = pages;
    var sheet = el("sheet");
    sheet.classList.toggle("fill", fillMode === "fill");
    sheet.innerHTML = "";
    layoutFor(pages.length).forEach(function(c){
      var cell = document.createElement("div"); cell.className = "cell";
      var src = c ? pages[c.file] : null;
      if (src) {
        var im = imgs && imgs[c.file];
        var done = false;
        if (fillMode === "extend" && im && im.naturalWidth) done = drawExtendedCell(cell, im, c.half, c.file);
        if (!done) {
          var img = document.createElement("img");
          img.className = c.half; img.src = src; img.alt = "";
          cell.appendChild(img);
        }
      }
      sheet.appendChild(cell);
    });
    el("msg").hidden = true; el("bar").hidden = false; el("wrap").hidden = false;
    fitToScreen();
  }

  /// 화면에서는 A2 한 장이 창보다 훨씬 크므로 축소해서 통째로 보여준다(인쇄 크기는 그대로).
  function fitToScreen(){
    var sheet = el("sheet");
    // 창 크기를 아직 못 재는 순간(0이나 음수)엔 억지로 줄이지 않는다.
    var availW = Math.max(200, window.innerWidth - 24);
    var availH = Math.max(200, window.innerHeight - 96);   // 위 도구 모음과 여백을 뺀 높이
    var w = sheet.offsetWidth || 1, h = sheet.offsetHeight || 1;
    var s = Math.max(0.05, Math.min(1, availW / w, availH / h));   // 한 장이 통째로 보이게
    sheet.style.transform = "scale(" + s + ")";
    // 아래위 padding(70+24)도 높이에 포함된다(box-sizing:border-box).
    // 이걸 빼먹어서 축소된 A2 한 장의 아래쪽 70px이 잘려 나갔다(아래 줄 그림이 짤림).
    el("wrap").style.height = (sheet.offsetHeight * s + 70 + 24) + "px";
  }
  window.addEventListener("resize", fitToScreen);

  el("printBtn").addEventListener("click", function(){ window.print(); });
  el("fillBtn").addEventListener("click", function(){
    fillMode = (fillMode === "extend") ? "fill" : (fillMode === "fill" ? "keep" : "extend");
    this.textContent = fillMode === "extend" ? "여백: 자동 채움"
                     : fillMode === "fill"   ? "여백: 꽉 채움(가장자리 잘림)"
                                             : "여백: 남김";
    if (lastPages) rebuild(lastPages);
  });

  function setNudge(v){
    seamNudge = v;
    el("seamVal").textContent = "이음매 " + (v > 0 ? "+" : "") + v;
    if (lastPages) rebuild(lastPages);
  }
  el("seamL").addEventListener("click", function(){ setNudge(seamNudge - 6); });
  el("seamR").addEventListener("click", function(){ setNudge(seamNudge + 6); });

  /// 지금 쓰는 그림들을 다시 불러 화면을 새로 그린다(자동 채움은 캔버스라 원본이 필요).
  function rebuild(list){
    seamCache = {};                                     // 그림이 바뀌면 이음매도 다시 찾는다
    // 먼저 crossOrigin 으로 불러온다(이음매를 찾으려면 픽셀을 읽어야 해서).
    // 그게 막히면 그냥 불러온다 — 픽셀은 못 읽어도 '그리기'는 되므로
    // 여백 채우기는 모든 그림에 똑같이 적용된다.
    function load(u){
      return new Promise(function(res){
        var a = new Image(); a.crossOrigin = "anonymous";
        a.onload = function(){ res(a); };
        a.onerror = function(){
          var b = new Image();
          b.onload = function(){ res(b); };
          b.onerror = function(){ res(null); };
          b.src = u;
        };
        a.src = u;
      });
    }
    Promise.all(list.map(load))
      .then(function(imgs){ return Promise.all(imgs.map(trimFrame)); })
      .then(function(imgs){ build(list, imgs); });
  }

  el("backBtn").href = "viewer.html?book=" + encodeURIComponent(bookId || "")
                     + (classId ? "&class=" + encodeURIComponent(classId) : "");
  // 반 갤러리 목록으로 — 반코드를 모르면 갤러리 첫 화면으로.
  el("listBtn").href = classId ? "./?class=" + encodeURIComponent(classId) : "./";

  if (!bookId) { el("msg").textContent = "주소에 book 이 없어요."; }
  else {
    fetch(API + "?book=" + encodeURIComponent(bookId))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok || !d.pages || !d.pages.length) { el("msg").textContent = "그림책을 찾지 못했어요 😢"; return; }
        rebuild(d.pages);                      // 먼저 원본으로 보여주고
        upscaleIfTooLow(d.pages).then(function(better){
          if (better.some(function(u, i){ return u !== d.pages[i]; })) rebuild(better);
        });
      })
      .catch(function(){ el("msg").textContent = "불러오지 못했어요. 잠시 뒤 다시 열어 주세요."; });
  }
</script>
</body>
